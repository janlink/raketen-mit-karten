<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raketen mit Karten</title>
<style>
/* ===== Stil "Mission Control" (hl0.27): dunkles Glas, dünne Linien, Eckklammern, kleine GROSSE Beschriftungen,
   Cyan (--cy) für Anzeigen, Bernstein (--amber) für Geld und Hinweise, Grün (--go) für fertig/kaufen, Rot (--red) für zu teuer/Fehlstart.
   Symbole: ic('name') aus ICONS (Sprite #i-name), keine Emojis. Schrift: Segoe UI, Überschriften/große Zahlen 800, Zahlen gleich breit. */
:root{--bg:#03060a;--cy:#62e3ff;--ink:#eaf7ff;--mut:#8ea5b8;--glass:rgba(6,12,19,.78);--line:rgba(98,227,255,.30);
  --amber:#ffb547;--go:#3cf2a0;--red:#ff5a6a;--goldg:linear-gradient(120deg,#fff1c4,#e8c170 40%,#b88a34 70%,#f3d690);
  --text:var(--ink);--muted:var(--mut);--gold:var(--amber);--green:var(--go)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;line-height:1.35;font-variant-numeric:tabular-nums}
/* Überschriften und große Zahlen: gleiche gut lesbare Schrift, nur kräftiger; Zahlen gleich breit, damit Zähler nicht wackeln */
h1,h2,b{font-weight:800}
/* Hintergrund: Erdrand von oben (assets/goal), darüber ein feines Raster */
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url(assets/goal/earth_limb.webp) center 104%/max(140%,1400px) auto no-repeat;filter:saturate(.55) brightness(.6)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(#03060a 0,#03060ae6 45%,#03060a40 100%),
  repeating-linear-gradient(90deg,#62e3ff0b 0 1px,#0000 1px 64px),repeating-linear-gradient(#62e3ff0b 0 1px,#0000 1px 64px)}
/* Symbole: dünne Linien, Flächen (class "f") leicht gefüllt; --fo = Deckkraft der Füllung */
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter;vertical-align:-.2em;overflow:visible}
symbol .f{fill:var(--f,currentColor);fill-opacity:var(--fo,.14)}
/* Glas-Kasten mit Eckklammern: --c = Farbe der Klammern, --bl = Rand, --gl = Glas */
.box,.tile,.dialog,.bpanel,.pbox,.card,.tro,.mis,#toast,#skipBtn,#ffBtn,#sndBtn,.iconbtn,#alt,.empanel,.empad,.alarmwait{--c:var(--cy);
  background:
   linear-gradient(var(--c),var(--c)) left top/12px 2px no-repeat,linear-gradient(var(--c),var(--c)) left top/2px 12px no-repeat,
   linear-gradient(var(--c),var(--c)) right top/12px 2px no-repeat,linear-gradient(var(--c),var(--c)) right top/2px 12px no-repeat,
   linear-gradient(var(--c),var(--c)) left bottom/12px 2px no-repeat,linear-gradient(var(--c),var(--c)) left bottom/2px 12px no-repeat,
   linear-gradient(var(--c),var(--c)) right bottom/12px 2px no-repeat,linear-gradient(var(--c),var(--c)) right bottom/2px 12px no-repeat,
   var(--gl,var(--glass));
  border:1px solid var(--bl,var(--line));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* kleine Beschriftung in Großbuchstaben */
.lbl,.kick,.hl,.hl2,.mlab{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.kick{display:block;font-size:11px;color:var(--cy)}
button{font:inherit;cursor:pointer;border:0;border-radius:0;color:inherit;background:none;padding:0;transition:transform .1s,background-color .15s,filter .15s,color .15s}
button:disabled{cursor:not-allowed}
/* Knöpfe: .btn mit abgeschrägten Ecken; primary = Cyan, sec = Glas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 26px;font-weight:800;font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn .ic{width:20px;height:20px}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--cy);color:#021820}
.btn.sec{background:#62e3ff1a;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4;filter:grayscale(.6)}
.iconbtn{width:48px;height:48px;display:grid;place-items:center;flex:none}
.iconbtn .ic{width:20px;height:20px}
.iconbtn:hover{background-color:#62e3ff26}
img.pix{image-rendering:pixelated;display:block}
.tile img.pix,.card img.pix,.bview img.pix{margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 24px;background:#03060acc;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;flex-wrap:wrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;padding:7px;color:var(--cy);border:1px solid var(--line)}
h1{margin:0;font-size:1.35rem;line-height:1.1}
.brand small{display:block;margin-top:3px}
.stats{display:flex;align-items:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:10px;padding:5px 16px;border-left:1px solid var(--line)}
.stat .ic{width:22px;height:22px;color:var(--cy)}
.stat span{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-size:1.25rem}
.stat b em{font-style:normal;font-weight:700;color:var(--mut)}
.stat.money .ic,.stat.money b{color:var(--amber)}
/* Pokal-Regal (8b1.7): im Kopf eine kleine Reihe Pokale (Klick = Regal), Pokal-Karten .tro im Sieg-Fenster und im Regal */
button.stat{min-height:44px;text-align:left}
button.stat:hover{background-color:#ffb5471a}
#wins{display:flex;align-items:center;gap:2px;min-height:1.65rem;color:var(--amber)}
#wins .ic{width:20px;height:20px;color:var(--amber);--fo:.35}
#wins em{margin-left:4px;font-size:1rem;color:var(--amber)}
.tros{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.tro{--c:var(--amber);--bl:#ffb54755;--gl:rgba(24,16,4,.7);width:128px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tro .ic{width:44px;height:44px;color:var(--amber);--fo:.3;filter:drop-shadow(0 0 10px #ffb54766)}
.tro .tn{font-size:1.6rem;line-height:1;color:var(--amber)}
.tro .td{font-size:.85rem;font-weight:700}
.tro .ts{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tro.new{animation:troIn .8s cubic-bezier(.2,1.5,.4,1) .25s both}
@keyframes troIn{from{opacity:0;transform:scale(.4) rotate(-10deg)}}
.muted{color:var(--mut)}
nav{display:flex;max-width:1200px;margin:0 auto;padding:0 16px;border-bottom:1px solid #62e3ff1f}
nav button{display:flex;align-items:center;gap:10px;min-height:52px;padding:14px 22px 12px;font-weight:800;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button .ic{width:20px;height:20px}
nav button:hover{color:var(--ink)}
nav button.active{color:var(--ink);border-bottom-color:var(--cy);text-shadow:0 0 12px #62e3ff88}
nav button.active .ic{color:var(--cy)}
main{padding:18px 16px 60px;max-width:1200px;margin:0 auto}
h2{margin:.2em 0}
.sechead{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap;margin:4px 0 16px}
.sechead h2{margin:0;font-size:1.6rem}
.sechead p{margin:0;color:var(--mut);font-size:.95rem}
.tip{display:flex;align-items:flex-start;gap:10px;margin:-6px 0 18px;color:var(--mut);font-size:.95rem}
.tip .ic{color:var(--amber);width:20px;height:20px}
.tip b{color:var(--ink)}
/* Aufträge (8b1.3): Kasten oben im Hangar, Zeile im Flugbericht, Zeichen an Raketen, die zu einem Auftrag passen.
   Bernstein = schafft eine eigene Rakete, Cyan (.hard) = dafür braucht man noch eine neue Rakete */
.mpanel{margin:0 0 24px}
.mhead{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.mhead>.ic{width:20px;height:20px;color:var(--amber)}
.mhead h3{margin:0;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.mhead p{margin:0;color:var(--mut);font-size:.9rem}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.mis{--c:var(--amber);--bl:#ffb54740;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.mis.hard{--c:var(--cy);--bl:var(--line)}
.mic{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid #ffb54766;border-radius:50%;color:var(--amber);box-shadow:0 0 0 4px #ffb54710}
.mis.hard .mic{color:var(--cy);border-color:var(--line);box-shadow:0 0 0 4px #62e3ff10}
.mic .ic{width:24px;height:24px}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mt b{font-size:.98rem;line-height:1.25;color:var(--ink)}
.mt small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.8rem}
.mt small .ic{width:14px;height:14px}
.mt .kick{color:var(--amber)}
.mg{display:flex;align-items:center;gap:5px;font-weight:800;font-size:1.05rem;color:var(--amber);white-space:nowrap}
.mg .ic{width:20px;height:20px}
.mpips{display:inline-flex;gap:3px}
.mpips i{width:16px;height:5px;background:#ffffff1f}
.mpips i.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.mtag{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;display:grid;place-items:center;color:var(--amber);background:#060c13cc;border:1px solid #ffb54766;border-radius:50%}
.mtag .ic{width:16px;height:16px}
.mdone{margin:14px auto 6px;max-width:470px;display:flex;flex-direction:column;gap:8px}
.mdone .mis{--gl:linear-gradient(180deg,#2a2213e6,#0d0b08ee);box-shadow:0 0 26px -8px #ffb547aa;animation:mIn .6s cubic-bezier(.2,1.4,.4,1) .9s both}
.mdone .mis:nth-child(2){animation-delay:1.1s}.mdone .mis:nth-child(3){animation-delay:1.3s}
@keyframes mIn{from{opacity:0;transform:scale(.7)}}

/* Glücksboxen */
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.box{--c:var(--bc);--bl:color-mix(in srgb,var(--bc) 40%,transparent);padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.box:hover{transform:translateY(-3px)}
.bxname{font-weight:800;font-size:1.05rem}
.bxcards{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--mut)}
/* Glücksbox (luckyBlock): Kiste als Drahtgitter, schwebt leicht; höhere Stufen leuchten und funkeln */
.lb{width:110px;height:114px;margin:4px auto 2px;animation:lbFloat 3.2s ease-in-out infinite}
.lb svg{width:100%;height:100%;display:block;overflow:visible}
.lb .hole{display:none}
.lb.l4 svg,.lbCube.l4 svg{filter:drop-shadow(0 0 8px var(--lbc))}
.lb.l5 svg,.lbCube.l5 svg{filter:drop-shadow(0 0 14px var(--lbc)) drop-shadow(0 0 4px #fff8)}
.lb .spark,.lbCube .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.lb .spark:nth-of-type(2n),.lbCube .spark:nth-of-type(2n){animation-delay:-.9s}
@keyframes lbFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
/* Box öffnen: Würfel wackelt, Deckel fliegt weg, Lichtblitz, dann kommen die Karten */
.lbStage{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;display:flex;justify-content:center;align-items:flex-start;padding-top:80px;
  animation:lbGone .5s 1.9s forwards}
.lbCube{width:180px;height:186px;position:relative;animation:lbShake 1s ease-in both,lbPop .5s 1s ease-in forwards}
.lbCube svg{width:100%;height:100%;display:block;overflow:visible}
.lbCube .lid{transform-box:fill-box;transform-origin:30% 100%;animation:lbLid .7s 1s ease-out forwards}
.lbCube .hole{opacity:0;animation:lbHole .3s 1s forwards}
.lbRays,.lbFlash{position:absolute;left:50%;top:173px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0}
.lbRays{background:repeating-conic-gradient(var(--lbc) 0 9deg,#0000 9deg 24deg);
  -webkit-mask-image:radial-gradient(circle,#000 15%,#0000 70%);mask-image:radial-gradient(circle,#000 15%,#0000 70%);animation:lbRays 1.3s 1s ease-out forwards}
.lbFlash{background:radial-gradient(circle,#fff 0,#fff8 25%,#0000 60%);animation:lbFlash .6s 1s ease-out forwards}
.lbBit{position:absolute;left:50%;top:165px;width:12px;height:12px;background:var(--lbc);box-shadow:0 0 8px #fff;opacity:0;animation:lbBit .9s 1s ease-out forwards}
@keyframes lbShake{0%{transform:none}15%{transform:rotate(-3deg)}25%{transform:rotate(3deg)}35%{transform:rotate(-5deg) translateY(-3px)}45%{transform:rotate(5deg)}
  55%{transform:rotate(-7deg) translateY(-6px)}63%{transform:rotate(7deg)}71%{transform:rotate(-9deg) translateY(-8px)}79%{transform:rotate(9deg)}
  86%{transform:rotate(-6deg) scale(1.05,.93)}93%{transform:rotate(4deg) scale(.95,1.08)}100%{transform:scale(1.08,.9)}}
@keyframes lbPop{0%{transform:scale(1.08,.9)}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.2) translateY(60px);opacity:0}}
@keyframes lbLid{to{transform:translate(70px,-200px) rotate(70deg);opacity:0}}
@keyframes lbHole{to{opacity:1}}
@keyframes lbRays{0%{opacity:0;transform:scale(.2) rotate(0)}20%{opacity:.9}100%{opacity:0;transform:scale(1.3) rotate(40deg)}}
@keyframes lbFlash{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@keyframes lbBit{0%{opacity:1;transform:translate(-50%,0) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.2) rotate(200deg)}}
.lbHead{animation:lbIn .4s 1s backwards}
@keyframes lbIn{from{opacity:0;transform:scale(.6)}}
@keyframes lbGone{to{opacity:0;visibility:hidden}}
/* Box in der Box: Bonus-Box als Karte, geht danach darunter mit eigener Animation auf */
.card.boxCard{box-shadow:0 0 26px -4px var(--lbc)}
.boxCard .cimg{align-items:center}
.boxCard.opened .lb{opacity:.35;animation:none;transition:opacity .4s}
.lbInner{position:relative;min-height:290px;border-top:1px solid #62e3ff33;margin-top:4px;padding-top:14px}
.lbInner:empty{display:none}
/* Bonus-Boxen gehen schneller auf (POP2=.5 s statt 1 s) */
.lbInner .lbStage{animation:lbGone .4s 1.1s forwards}
.lbInner .lbCube{animation:lbShake .5s ease-in both,lbPop .45s .5s ease-in forwards}
.lbInner .lbCube .lid,.lbInner .lbCube .hole,.lbInner .lbRays,.lbInner .lbFlash,.lbInner .lbBit,.lbInner .lbHead{animation-delay:.5s}
.card.boxCard.jump{animation:lbJump .5s ease-out}
/* Geld-Karte: goldener Münzstapel, leuchtet in Bernstein, ein Glanz läuft darüber */
.card.moneyCard{--tc:var(--amber);--gl:linear-gradient(180deg,#2a2213e6,#0d0b08ee);box-shadow:0 0 28px -6px #ffb547aa}
.moneyCard .cimg{align-items:center}
.mStack{position:relative;width:120px;height:120px;animation:mBob 2.4s ease-in-out infinite}
.mStack .ic{position:absolute;color:#ffe3a3;--f:var(--amber);--fo:.6;stroke-width:1.2;filter:drop-shadow(0 0 10px #ffb54799)}
.mStack .m1{width:92px;height:92px;left:14px;top:22px}
.mStack .m2{width:50px;height:50px;left:-6px;top:58px;transform:rotate(-14deg)}
.mStack .m3{width:44px;height:44px;right:-4px;top:4px;transform:rotate(16deg)}
@keyframes mBob{50%{transform:translateY(-6px)}}
.moneyCard .cinfo{font-size:1.05rem}
.mShine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,#0000 35%,#fff3c840 48%,#fff3c870 50%,#fff3c840 52%,#0000 65%) 0 0/300% 100%;animation:mShine 2.6s ease-in-out infinite}
@keyframes mShine{0%{background-position:100% 0}60%,100%{background-position:0 0}}
@keyframes lbJump{0%{transform:none}40%{transform:translateY(-26px) scale(1.12) rotate(-6deg)}70%{transform:translateY(4px) scale(.96)}100%{transform:none}}
/* Knall über allem (lbBurst): große Strahlen, Blitz, Konfetti; Dialog ruckelt (lbPunch), beim Jackpot stärker */
.lbBurst{position:fixed;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.lbBurst .lbRays,.lbBurst .lbFlash{left:var(--x);top:var(--y)}
.lbBurst .lbRays{width:900px;height:900px;margin:-450px 0 0 -450px;animation:lbRays 1.2s ease-out forwards}
.lbBurst .lbFlash{width:640px;height:640px;margin:-320px 0 0 -320px;animation:lbFlash .7s ease-out forwards}
.lbBurst.jack .lbRays{width:1500px;height:1500px;margin:-750px 0 0 -750px;animation-duration:2s}
.lbBurst.jack .lbFlash{width:1100px;height:1100px;margin:-550px 0 0 -550px;animation-duration:1s}
.lbConf{position:absolute;left:var(--x);top:var(--y);width:10px;height:10px;background:currentColor;box-shadow:0 0 6px #fff8;opacity:0;animation:lbConf 1.4s ease-out forwards}
.lbConf.c1{border-radius:50%}.lbConf.c2{width:5px;height:15px}
.lbBurst.jack .lbConf{width:14px;height:14px;animation-duration:2s}
.lbBurst.jack .lbConf.c2{width:6px;height:20px}
@keyframes lbConf{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}70%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 90px)) scale(1.1) rotate(var(--rot))}}
.lbPunch{animation:lbPunch .45s ease-out}
.lbPunch.lbBig{animation:lbPunchBig .8s ease-out}
@keyframes lbPunch{20%{transform:scale(1.035) rotate(-.6deg)}40%{transform:scale(.99) translateX(6px)}60%{transform:translateX(-5px)}80%{transform:translateX(2px)}}
@keyframes lbPunchBig{12%{transform:scale(1.07) rotate(-1.2deg)}28%{transform:scale(.97) translateX(12px) rotate(1deg)}44%{transform:scale(1.03) translateX(-10px)}
  60%{transform:translateX(7px)}76%{transform:translateX(-4px)}90%{transform:translateX(2px)}}
/* Glücks-Stufe als Sterne (stars()): an = Bernstein, aus = dunkel */
.lvl{display:inline-flex;gap:3px;color:var(--amber)}
.lvl .ic{width:15px;height:15px;--fo:1}
.lvl .ic.off{color:#ffffff2e;--fo:0}
.dhead .lvl .ic{width:18px;height:18px}
.odds{width:100%;font-size:.85rem;text-align:left;display:grid;gap:4px;border-top:1px solid #62e3ff1f;padding-top:8px}
.odds div{display:flex;justify-content:space-between;gap:6px}
.odds span{display:flex;align-items:center;gap:7px;color:var(--mut)}
.dot{display:inline-block;width:7px;height:7px;background:var(--tc)}
.buy{width:100%;min-height:48px;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:4px;padding:10px;font-weight:800;font-size:1.1rem;
  color:var(--go);border:1px solid var(--go);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.buy .ic{width:20px;height:20px}
.buy:hover:not(:disabled){background:var(--go);color:#03140c}
.buy:active:not(:disabled){transform:scale(.97)}
.buy:disabled{border-color:#ffffff22;color:#ffffff45}

/* Hangar */
.tierHead{margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.tierHead i{width:10px;height:10px;background:var(--tc);box-shadow:0 0 10px var(--tc)}
.tierHead h2{margin:0;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tc)}
.tierHead span{font-size:.85rem;font-weight:700;color:var(--mut)}
.tierHead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 45%,transparent),#0000)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{--c:var(--tc);--bl:color-mix(in srgb,var(--tc) 28%,transparent);position:relative;overflow:hidden;padding:12px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .15s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--tc),0 0 24px -6px var(--tc)}
.tile:active{transform:scale(.985)}
.tile svg.rk{height:210px;width:auto;max-width:100%}
.tile.locked svg.rk,.tile.locked img.pix{filter:brightness(0) opacity(.45)}
.tile.unbuilt img.pix,.tile.unbuilt svg.rk{opacity:.45}
/* Raketen-Bilder aus Blender: alle Bilder gleich groß, liegen übereinander */
.rimg{position:relative;display:block;flex:none}
.rimg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.rimg .pad{position:absolute;left:-50px;right:-50px;bottom:-7px;height:7px;background:#56607a}
.tile .rimg{height:210px}
.tile.locked .rimg{filter:brightness(0) opacity(.45)}
.tile.unbuilt .rimg{opacity:.45}
.tile .nm{font-weight:800;font-size:1rem}
.tile .st{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut)}
.tile .st.ok{color:var(--go)}.tile .st.wait{color:var(--amber)}
.tile .rimg,.card .cimg{background:radial-gradient(50% 30% at 50% 100%,color-mix(in srgb,var(--tc) 18%,transparent),#0000)}
.bar{width:100%;height:4px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cy);box-shadow:0 0 6px var(--cy)}
.t0{--tc:#a3b0c2}.t1{--tc:#3d8bff}.t2{--tc:#a466ff}.t3{--tc:#f5b82e}
/* Holo-Glanz für Epische und Legendäre (Karten und Hangar): Regenbogen-Streifen wandert schräg drüber,
   Funkeln blinkt, Lichtfleck folgt Maus/Finger (--mx/--my, siehe holoPointer). Bewegt wird nur transform/opacity,
   damit es auf dem iPad auch mit vielen Karten flüssig bleibt. Legendär kräftiger und mit zweitem Funkeln (<i> im Glanz). */
.holo{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:color-dodge;opacity:.6;
  background:radial-gradient(circle 80px at var(--mx,50%) var(--my,-60%),#ffffff66,#0000)}
.holo::before{content:"";position:absolute;top:0;bottom:0;left:-100%;width:300%;
  background:linear-gradient(115deg,#0000 34%,#ff9ad560 40%,#ffe9a060 45%,#9affc860 50%,#9ae6ff60 55%,#c9a0ff60 60%,#0000 66%);
  animation:holo 4.5s ease-in-out infinite alternate}
@keyframes holo{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
/* Funkeln: kleine Lichtpunkte oben und neben der Rakete (nicht über Name und Text) */
.holo::after,.holo i{content:"";position:absolute;inset:0;animation:holoTw 2.4s ease-in-out infinite;
  background:radial-gradient(circle at 18% 14%,#fff 0 2px,#fffa 2.5px,#0000 5px),radial-gradient(circle at 82% 24%,#fff 0 1.5px,#fffa 2px,#0000 4.5px),
    radial-gradient(circle at 24% 46%,#fff 0 1.5px,#fffa 2px,#0000 4px),radial-gradient(circle at 76% 58%,#fff 0 2px,#fffa 2.5px,#0000 5px)}
.holo i{animation-duration:3.1s;animation-delay:-1.4s;
  background:radial-gradient(circle at 70% 10%,#fff 0 2px,#fffa 2.5px,#0000 5px),radial-gradient(circle at 12% 32%,#fff 0 1.5px,#fffa 2px,#0000 4px),
    radial-gradient(circle at 88% 42%,#fff 0 1.5px,#fffa 2px,#0000 4.5px),radial-gradient(circle at 30% 64%,#fff 0 2px,#fffa 2.5px,#0000 5px)}
@keyframes holoTw{0%,100%{opacity:.1}50%{opacity:1}}
/* Episch: ruhiger, kühler (Violett/Blau), langsamer, nur ein Funkeln */
.t2 .holo{opacity:.42}
.t2 .holo::before{animation-duration:6.5s;
  background:linear-gradient(115deg,#0000 36%,#c9a0ff50 43%,#9ae6ff50 50%,#ff9ad550 57%,#0000 64%)}
.t2 .holo::after{animation-duration:3.2s}
.tile.t3:not(.locked){--gl:linear-gradient(180deg,#2a2213e6,#0d0b08ee);box-shadow:0 0 28px -10px #f5b82eaa}
.tile .holo{mix-blend-mode:screen;opacity:.42}
.tile.t2 .holo{opacity:.3}
/* Weniger Bewegung: Glanz steht still (schräg oben links), Funkeln leuchtet ruhig */
@media (prefers-reduced-motion:reduce){
  .holo::before{animation:none;transform:translateX(-12%)}
  .holo::after,.holo i{animation:none;opacity:.6}
}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:#03060ad9;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.hidden{display:none!important}
.dialog{--gl:rgba(6,12,19,.92);padding:24px 26px;max-width:940px;width:100%;position:relative;max-height:calc(100vh - 32px);overflow:auto}
.dialog.narrow{max-width:580px;padding:28px 30px}
.dhead{display:flex;flex-direction:column;align-items:center;gap:6px}
.dhead h2{margin:0;font-size:1.75rem}
.dhead .kick.jack{color:var(--amber)}
.dfoot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent)}
.tag::before{content:"";width:6px;height:6px;background:var(--tc)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.badges span{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;font-size:.85rem;border:1px solid #62e3ff26;background:#62e3ff0a;color:#cfe6f2}
.badges .ic{color:var(--cy)}
.small{font-size:.9rem;color:var(--mut)}

/* Karten: Glas mit Klammern in der Farbe der Seltenheit; erscheinen von unten (cardIn) */
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.card{--c:var(--tc);--bl:color-mix(in srgb,var(--tc) 50%,transparent);position:relative;overflow:hidden;width:164px;padding:12px 12px 14px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card.boxCard{overflow:visible} /* Funkeln und Leuchten der Bonus-Box nicht abschneiden (sie hat keinen Holo-Glanz) */
.tst{display:contents}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.card .tier{width:100%;text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);
  padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.card .cimg{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center;margin:8px 0 6px}
.card .cimg svg.rk{height:150px;width:auto;max-width:100%}
.card .cimg .rimg{height:150px}
.card .cname{font-weight:800;font-size:1.05rem}
.card .cmeta{font-size:.78rem;color:var(--mut)}
.card .cinfo{margin-top:6px;font-size:.85rem;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.cinfo b{color:var(--amber)}.cinfo .ic.coin{color:var(--amber)}
.cinfo .unl,.cinfo .okc{color:var(--go);display:flex;gap:6px;align-items:center;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem}
.cinfo .unl .ic{--fo:1}
.card.t2{box-shadow:0 0 22px -8px #a466ffaa}
/* Legendär: Gold-Rand, warmes Glas und Holo-Glanz */
.card.t3{border:1px solid transparent;background:linear-gradient(180deg,#2a2213f0,#100d08f5) padding-box,var(--goldg) border-box;
  box-shadow:0 0 44px -10px #e8c170cc,inset 0 1px 0 #fff3;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) backwards,goldGlow 2.6s ease-in-out infinite}
@keyframes goldGlow{50%{box-shadow:0 0 56px -6px #e8c170ee,inset 0 1px 0 #fff3}}
.card.t3 .tier{background:var(--goldg);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;border-bottom-color:#e8c17066}
.center{text-align:center}
/* Ergebnis, Willkommen, Sieg: rundes Symbol, kleine Beschriftung, Überschrift */
.resic{width:64px;height:64px;margin:0 auto 10px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--cy);box-shadow:0 0 0 6px #62e3ff10}
.resic .ic{width:32px;height:32px}
.resic.bad{color:var(--red);border-color:#ff5a6a66;box-shadow:0 0 0 6px #ff5a6a14}
.resic.gold{color:var(--amber);border-color:#ffb54766;box-shadow:0 0 0 6px #ffb54714,0 0 30px -6px #ffb54788}
.res h2{margin:4px 0 6px;font-size:2rem}
.res p{margin:8px 0;color:#cfe0ec}.res p b{color:#fff}
.meter{margin:18px auto 6px;max-width:440px}
.mtrack{height:10px;background:repeating-linear-gradient(90deg,#ffffff1a 0 14px,#0000 14px 17px)}
.mtrack i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cy) 0 14px,#0000 14px 17px);filter:drop-shadow(0 0 4px var(--cy))}
.mlab{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.gain{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 6px;color:var(--amber)}
.gain b{font-size:2.75rem;line-height:1;text-shadow:0 0 20px #ffb54766}
.gain .ic{width:36px;height:36px}
/* Münzregen: fliegende Münzen, Funkeln beim Ankommen, Geldanzeige über dem dunklen Hintergrund (über #modal, unter #launch) */
.coinFly{position:fixed;left:0;top:0;z-index:26;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 36% 30%,#fff7d0 0 12%,#ffd45c 30%,#f0a52a 62%,#a8650c 100%);
  box-shadow:inset 0 0 0 2px #ffe08a99,inset 0 0 0 5px #c47a1255,0 0 10px #ffb547aa}
.coinSpark{position:fixed;z-index:26;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff8 0 18%,#ffd45c66 30%,#0000 62%);box-shadow:0 0 0 2px #ffd45c88;animation:coinSpark .45s ease-out forwards}
@keyframes coinSpark{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.moneyLift{position:fixed;z-index:25;margin:0;pointer-events:none;background:#03060af0;border:1px solid #ffb54766;
  box-shadow:0 0 28px -6px #ffb547aa;animation:moneyLift .25s ease-out;transition:opacity .4s}
.moneyLift.out{opacity:0}
.moneyLift b{font-variant-numeric:tabular-nums}
@keyframes moneyLift{from{opacity:0}}
.res .note{font-size:.88rem;color:var(--mut)}
/* Teile-Check nach einem Fehlstart (8b1.5) */
.pcheck{margin:14px auto 4px;max-width:440px;text-align:left}
.pcheck .kick{display:block;text-align:center;margin-bottom:6px}
.pcheck ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pcheck li{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);background:#ffffff08;font-size:.9rem}
.pcheck li small{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pcheck li.ok{color:#fff}.pcheck li.ok .ic,.pcheck li.ok small{color:var(--go)}
.pcheck li.ko{color:var(--mut)}.pcheck li.ko .ic,.pcheck li.ko small{color:var(--red)}
.pcheck .ic{width:16px;height:16px;flex:none}
@media (max-width:480px){.pcheck ul{grid-template-columns:1fr}}

/* Start-Animation */
#launch{position:fixed;inset:0;z-index:30;overflow:hidden}
#shk{position:absolute;inset:0;transform-origin:50% 50%} /* Kamerawackeln (shake in playLaunch) */
#sky{position:absolute;inset:0;background:var(--skytop,#4fa3ff)}
#bgFar{position:absolute;left:0;right:0;bottom:0;height:100%;background-size:cover;background-position:center bottom;will-change:transform;
  /* oberer Rand weich in #sky (beim Aufstieg rutscht das Bild nach unten; sonst harte Kante im Himmel) */
  -webkit-mask-image:linear-gradient(#0000,#000 22%);mask-image:linear-gradient(#0000,#000 22%)}
#space{position:absolute;inset:0;background:linear-gradient(#000008,#0b1640);opacity:0}
#stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),radial-gradient(2px 2px at 60px 150px,#fff,transparent),radial-gradient(1px 1px at 170px 170px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 110px,#cfe8ff,transparent),radial-gradient(1px 1px at 150px 20px,#fff,transparent);background-size:200px 200px}
/* Aufstieg (playLaunch, Wolken und Sonne): Sonne #sun und Haufenwolken hinter (#clb) und vor (#clf) der Rakete, Lage per JS */
#sun,#clb,#clf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sun,#clb{opacity:0;transition:opacity 1.6s}
#sun{mix-blend-mode:screen;will-change:transform}
#sun i{position:absolute;border-radius:50%;translate:-50% -50%}
#sun .sh{background:radial-gradient(closest-side,#fff6dc40,#fff6dc14 50%,#fff6dc00)}
#sun .sg{background:radial-gradient(closest-side,#fffaf0,#fff4d8cc 12%,#ffe8b055 35%,#ffe8b000)}
#sun .sc{background:radial-gradient(closest-side,#fff,#fff 80%,#fffbea00)}
#launch.dusk #sun .sh{background:radial-gradient(closest-side,#ff9a5850,#ff7a4020 50%,#ff6a3000)}
#launch.dusk #sun .sg{background:radial-gradient(closest-side,#ffe2a8,#ffb46ecc 14%,#ff86486a 38%,#ff6a3000)}
#launch.dusk #sun .sc{background:radial-gradient(closest-side,#fff4d0,#ffd08a 78%,#ffb06000)}
#launch.dusk #sun .sb{background:radial-gradient(closest-side,#ffb0708a,#ff905040 45%,#ff804000)}
.acl{position:absolute;left:0;top:0;will-change:transform,opacity}
.acl img{display:block;width:100%}
#launch.dusk .acl img{filter:saturate(1.15) hue-rotate(-14deg) brightness(1.08)}
#ground,#steam{position:absolute;left:0;right:0;bottom:0;height:100%;pointer-events:none;will-change:transform}
#ground .pd{position:absolute;display:block;max-width:none}
#site{-webkit-mask-image:linear-gradient(90deg,#0000,#000 9%,#000 91%,#0000);mask-image:linear-gradient(90deg,#0000,#000 9%,#000 91%,#0000)}
#ground .tw{position:absolute;display:flex;flex-direction:column}
#ground .tw>*{display:block;flex:none;position:static}
#ground .tw>.lift{position:absolute;transition:bottom 2.6s ease-in-out}
#ground .arm{position:absolute;transform-origin:0 50%;transition:transform 1.6s ease-in-out}
#ground .arm>*{position:absolute;bottom:0;max-width:none}
#ground .arm.away{transform:scaleX(.07) translateY(-6px)}
#ground .arm.mzq{filter:saturate(.1) brightness(1.05)} /* Starship-Turm (Mechazilla): Versorgungsarm in Stahlgrau statt Turm-Rot */
#ground .mza,#steam .mza{position:absolute;background-repeat:no-repeat;pointer-events:none} /* Fangarme (Bildstreifen), setupPad */
#ground .beam{position:absolute;transform-origin:50% 100%;background:linear-gradient(0deg,#ffe2b0cc,#ffd59a33 55%,#ffd59a00);clip-path:polygon(42% 100%,58% 100%,100% 0,0 0);mix-blend-mode:screen;opacity:.55}
#ground .glow{position:absolute;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(#fff6d0,#ffb347 30%,#ff6a0080 55%,#ff6a0000 72%);opacity:0;transition:opacity .25s;mix-blend-mode:screen}
#steam .st{position:absolute;pointer-events:none;will-change:transform,opacity}
#launch.dusk #rocketSvg,#launch.dusk .drop{filter:brightness(.8) sepia(.22) saturate(1.15)}
#launch.dusk #steam .st{filter:sepia(.5) brightness(.85) hue-rotate(-12deg)}
#rw{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;transform-origin:50% 100%}
#rocketSvg svg{display:block}
/* Flamme: ein .fl je Triebwerk/Booster, Flackern per JS (playLaunch) */
#flame{position:absolute;left:50%;top:100%;width:0;height:0;pointer-events:none}
#flame .fl{position:absolute;transform-origin:50% 0;pointer-events:none;will-change:transform}
#flame .fl::before{content:'';position:absolute;inset:0;border-radius:50%/5% 5% 95% 95%;
  background:radial-gradient(ellipse 50% 100% at 50% 0,#fffef5 0,#fff3b0 9%,#ffcf4a 20%,#ff9a24 36%,#ff6a1ae6 54%,#e8441899 72%,#b02a1033 88%,#a0200000 100%)}
#flame .fl::after{content:'';position:absolute;left:18%;right:18%;top:0;height:32%;border-radius:50%/8% 8% 92% 92%;
  background:radial-gradient(ellipse 50% 100% at 50% 0,#fff 0,#fffbe6 45%,#fff3b000 100%)}
#flame .flglow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(#fff6d8cc,#ffb34766 35%,#ff6a0000 70%)}
/* Shader-Flamme (WebGL, eine Leinwand für alle Düsen); ohne WebGL bleiben die .fl-Flammen */
#flgl{position:absolute;pointer-events:none;display:none}
#flame.gl #flgl{display:block}
#flame.gl .fl{display:none}
#plume{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#boomgl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none} /* Explosion (Flipbooks), über Rakete und Wolken, unter #fx */
.puff{position:absolute;bottom:0;width:70px;height:70px;border-radius:50%;background:#eef0f3dd;animation:puff 2.8s ease-out forwards;pointer-events:none}
@keyframes puff{from{transform:translate(-50%,0) scale(.3);opacity:.95}to{transform:translate(calc(-50% + var(--dx)),-40px) scale(2.4);opacity:0}}
#fx,#fxb{position:absolute;inset:0;pointer-events:none}
/* abgeworfene Booster/Stufen (playLaunch: piece); #fxb liegt hinter der Rakete (hinterer Booster) */
.drop{position:absolute;pointer-events:none;will-change:transform,opacity}
.drop img{position:absolute;inset:0;width:100%;height:100%;display:block}
#fxb .drop{filter:brightness(.72) saturate(.85)}
/* Triebwerk der Oberstufe (tools/blender/upperengine.py), liegt unter den Stufen-Bildern; .hot = glühende Düse */
.rimg img.ueng{inset:auto;max-width:none}
.rimg img.ueng.hot{opacity:0;mix-blend-mode:screen}
/* Trenn-, Ullage- und Abwurfmotoren: kurzer heller Strahl; --a Richtung (0 = nach unten), --l Länge, --w Breite */
.jet{position:absolute;width:var(--w);height:var(--l);margin-left:calc(var(--w) / -2);transform-origin:50% 0;transform:rotate(var(--a));
  border-radius:50%/8% 8% 92% 92%;background:radial-gradient(60% 55% at 50% 4%,#fffef4,#ffe7a8 30%,#ff9d3c88 60%,#ff6a1f00);
  mix-blend-mode:screen;pointer-events:none;animation:jetfl .07s steps(2) infinite alternate}
.jet.gas{background:radial-gradient(55% 55% at 50% 4%,#ffffffd0,#e6eef8a0 35%,#cfd8e430 70%,#cfd8e400);mix-blend-mode:normal}
@keyframes jetfl{to{scale:1 .82}}
/* Innenseite einer Verkleidungshälfte (Umriss aus dem Bild der Spitze, gespiegelt an der Trennfuge) */
.drop .inner{position:absolute;inset:0;
  background:linear-gradient(90deg,#e3e8ee,#9aa3ae 5%,#5b636e 22%,#3c434c 50%,#5b636e 78%,#9aa3ae 95%,#e3e8ee);
  -webkit-mask:var(--m) 0 0/100% 100% no-repeat;mask:var(--m) 0 0/100% 100% no-repeat}
/* Feuer im offenen Gitter beim heißen Trennen (Sojus): Triebwerke der oberen Stufe zünden noch vor dem Abwurf */
.hsfire{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(closest-side,#fff8e0,#ffc46b 35%,#ff7a2a88 65%,#ff5a1a00);animation:hsf .09s steps(2) infinite alternate}
@keyframes hsf{to{scale:1.12 .9;opacity:.85}}
/* Starship: Methan-Feuer (rosa-orange Hülle, bläulich-weißer Kern) im Heißtrennungs-Ring und Strahlen aus seinen Schlitzen */
.hsfire.ch4{background:radial-gradient(closest-side,#f3f1ff,#ffd2b8 30%,#ff9d86aa 58%,#d0649c00)}
.jet.ch4{background:radial-gradient(60% 55% at 50% 4%,#f4f2ff,#ffd0b4 28%,#ff9a84a0 58%,#cd64a400)}
/* Explosion beim Fehlstart (playLaunch: explode): Blitz, Feuerball aus mehreren Ballen, Druckring, Funken, brennende Trümmer;
   der dunkle Rauch kommt über puff() auf #plume */
.xfl{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
.xball{position:absolute;border-radius:50%;pointer-events:none;opacity:0;will-change:transform,opacity,filter;
  background:radial-gradient(closest-side,#fffbe6,#ffe58a 20%,#ffb12e 38%,#ff6a12 56%,#d42d0e 72%,#8c1a0a99 86%,#5a100600)}
.xring{position:absolute;border-radius:50%;pointer-events:none;opacity:0;border:3px solid #fff4dccc;
  box-shadow:0 0 18px #ffd9a0aa,inset 0 0 18px #ffd9a066}
.xsp{position:absolute;left:0;top:0;width:16px;height:3px;margin:-1.5px 0 0 -8px;border-radius:2px;pointer-events:none;
  background:linear-gradient(90deg,#ff8a1f00,#ffc24a 45%,#fffbe8);box-shadow:0 0 6px #ffb347}
.xdeb{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,filter}
.chute{position:absolute;width:76px;transform:translateX(-50%);transition:top 3.5s linear}
.chute img{display:block;width:100%}
.chute img+img{width:40%;margin:-4px auto 0}
/* Rettung beim Fehlstart: erst schießt die Kapsel aus dem Feuer nach oben (.up, kleiner Feuerstrahl), dann geht der Schirm auf */
.chute img:first-child{transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%}
.chute.up img:first-child{opacity:0;transform:scale(.2,.4)}
.chute .cjet{position:absolute;left:50%;top:100%;width:14px;height:46px;margin:-6px 0 0 -7px;border-radius:50%/10% 10% 90% 90%;
  background:radial-gradient(60% 55% at 50% 5%,#fffef4,#ffe7a8 30%,#ff9d3c88 60%,#ff6a1f00);mix-blend-mode:screen;transition:opacity .3s}
.chute:not(.up) .cjet{opacity:0}
/* Flugphasen nach dem Aufstieg (playLaunch: deploy = Satellit aussetzen, crewHome/home = Rückkehr der Kapsel) */
.sat{position:absolute;transform:translate(-50%,-50%)}
.sat>.satm{position:absolute;inset:0}
/* Bilder aus tools/blender/satellite.py (assets/sat), deckungsgleich; Flügel klappen vom Kasten aus auf (Drehpunkt = Flügelwurzel) */
.sat img{position:absolute;inset:0;width:100%;height:100%;display:block}
.sat .wl,.sat .wr{transform:scaleX(.05);opacity:0;transition:transform .9s cubic-bezier(.3,1.3,.5,1),opacity .15s}
.sat .wl{transform-origin:43% 50%}
.sat .wr{transform-origin:57% 50%;transition-delay:.15s}
.sat .fd{transition:opacity .2s}
.sat.open .wl,.sat.open .wr{transform:none;opacity:1}
.sat.open .fd{opacity:0}
.cpk{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.cpk .swing{position:absolute;inset:0;transform-origin:50% 0}
.cpk.sway .swing{animation:sway 1.7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.cpk .cap{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
/* Kapsel und Schirm: Bilder aus tools/blender/capsule.py (assets/cap) */
.cpk .cap .ci,.cpk .cap img,.cpk .chu img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cpk .cap .hot{opacity:0}
.cpk .cap.shake .ci{animation:shake .09s linear infinite}
@keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,2px)}}
.cpk .plasma{position:absolute;left:50%;bottom:-30%;width:190%;height:110%;transform:translateX(-50%);border-radius:50%;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(closest-side,#fffbe8,#ffd36b 25%,#ff7a1a 55%,#ff3d0066 78%,#ff3d0000)}
.cpk .trail{position:absolute;left:50%;bottom:30%;width:150%;height:380%;transform:translateX(-50%);opacity:0;filter:blur(3px);
  background:linear-gradient(0deg,#ffc24bdd,#ff6a1a77 40%,#ff3d0000);clip-path:polygon(18% 100%,82% 100%,100% 0,0 0)}
.cpk .chu{position:absolute;left:0;right:0;top:0;transform-origin:50% 100%;opacity:0}
.cpk .chu .op{transform-origin:50% 100%;opacity:0}
/* Landung mit Blender-Boden (playLaunch: home, homeView; Bilder aus tools/blender/landing.py in assets/land):
   Leinwand des Boden-Shaders, Haufenwolken, Schleier in der Wolke, Kapsel-Schatten, Gischt/Staub, Schaum, Welle */
#ldgl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.puff{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}
.puff img{display:block;width:100%}
.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#f4f7fbee,#e9eef5bb 60%,#dfe6ef88)}
#launch.dusk .veil{background:radial-gradient(ellipse at 50% 55%,#f3dcc8dd,#c9b4aab0 60%,#8f8a9a88)}
.cshadow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,#1a1206cc,#1a120666 55%,#1a120600)}
.spl{position:absolute;pointer-events:none;max-width:none}
.grass{position:absolute;pointer-events:none}
.grass img{display:block;width:100%;height:100%}
.foam{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,#ffffffee,#f2f7faa8 45%,#e8f1f733 75%,#e8f1f700)}
#launch.dusk .foam{background:radial-gradient(closest-side,#f3e4d6dd,#d8c8bc90 45%,#b8aaa433 75%,#b8aaa400)}
.wring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;border:2px solid #ffffffb0;box-shadow:0 0 6px #ffffff80}
#launch.dusk .wring{border-color:#f0dcc8a0;box-shadow:0 0 6px #f0dcc860}
/* Wasser beim Aufsetzen: Schleier (senkrecht gestreift, oben ausfransend) und Tropfen */
.wsheet{position:absolute;pointer-events:none;transform-origin:50% 100%;border-radius:48% 48% 14% 14%/72% 72% 10% 10%;
  background:linear-gradient(0deg,#fffffff2,#f4f9fde8 30%,#e6f1f8b0 65%,#e6f1f800);filter:blur(.7px);
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 3px,#000b 3px 5px,#0007 5px 6px);mask-image:repeating-linear-gradient(90deg,#000 0 3px,#000b 3px 5px,#0007 5px 6px)}
.drop2{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e4f0f8 60%,#c6dceb)}
#launch.dusk .wsheet,#launch.dusk .drop2{filter:blur(.7px) sepia(.45) brightness(.82)}
.cpk .cap.bob{animation:bob 1.7s ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -1.5px}to{translate:0 1.5px}}
/* Starship-Rückkehr (playLaunch: shipHome; Bilder aus tools/blender/starship_ship.py in assets/ship): .ssk liegt im Drehpunkt,
   .ssr = gedrehtes Raumschiff (90° Bauchlage, 0° stehend), .ssfl = Feuer der Landezündung, .sspl Plasma, .sstr Feuerschweif */
.ssk{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.ssk .ssr{position:absolute}
.ssk .ssi{position:absolute;inset:0}
.ssk .ssi img{position:absolute;display:block;max-width:none}
.ssk .ssi .hot,.ssk .ssi .ehot{opacity:0}
.ssk .ssi .ehot{mix-blend-mode:screen}
.ssk .ssi.shake{animation:shake .09s linear infinite}
.ssk .ssfl{position:absolute;inset:0;opacity:0}
.ssk .ssr.bob{animation:bob 1.7s ease-in-out infinite alternate}
.ssk .sspl{position:absolute;border-radius:50%;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(closest-side,#fff6ee,#ffc6a4 25%,#ff7a4a 55%,#e0407a66 78%,#c0306000)}
.ssk .sstr{position:absolute;opacity:0;filter:blur(3px);
  background:radial-gradient(50% 100% at 50% 100%,#ffc29acc,#ff6a4a70 40%,#d0408026 75%,#d0408000)}
#launch.dusk .ssk .ssi img:not(.hot):not(.ehot){filter:brightness(.8) sepia(.22) saturate(1.15)}
/* Abendlicht auf Kapsel und Schirm (wie die Rakete am Abend) */
#launch.dusk .cpk .ci img:first-child,#launch.dusk .cpk .chu img{filter:brightness(.8) sepia(.22) saturate(1.15)}
/* ohne WebGL: einfacher Boden aus Verläufen */
.earth{position:absolute;left:0;right:0;top:0;height:70%;will-change:transform}
.earth.sea{background:repeating-linear-gradient(176deg,#0000 0 22px,#ffffff1c 22px 25px),linear-gradient(#b8dcff,#3b8fe0 3%,#1d63b5 30%,#0d3f7a)}
.earth.steppe{background:repeating-linear-gradient(178deg,#0000 0 30px,#6b7a2a22 30px 36px),linear-gradient(#efe0a8,#cdb36c 4%,#b39548 40%,#8c7436)}
.earth.dusk{filter:brightness(.6) sepia(.35) saturate(1.2)}
.fsky{position:absolute;inset:0;background:linear-gradient(#4f86c4,#a9c8e6 75%,#dbe7f1)}
.fsky.dusk{background:linear-gradient(#1f2d44,#4c5872 50%,#c98a62 76%,#e8b07c)}
.cloud{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,#fff,#ffffffd0 45%,#fff0);will-change:transform}
.cut{position:absolute;inset:0;background:#000;pointer-events:none}
/* Ziel im Flug (playLaunch: earthBelow = Erde unten im Bild, arrive = Ankunft beim Mond, Mars ...); Bilder aus tools/blender/planets.py (assets/goal) */
#goal{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#goal .gb{position:absolute;left:0;top:0;will-change:transform}
#goal img{position:absolute;display:block;max-width:none}
#goal .gb>img{inset:0;width:100%;height:100%}
#goal .sunglow{position:absolute;inset:-60%;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(closest-side,#fff6d0,#ffd36bcc 34%,#ff9a2a66 52%,#ff6a1a22 70%,#ff6a0000)}
#goal .spark{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(closest-side,#fffbe8,#ffe9a0aa 30%,#ffd36b33 60%,#ffd36b00);animation:spark 1.1s ease-out forwards}
@keyframes spark{from{width:10px;height:10px;opacity:1}to{width:260px;height:260px;opacity:0}}
.ring{position:absolute;border:3px solid #ffffffcc;border-radius:50%;transform:translate(-50%,-50%);animation:ring 1.3s ease-out forwards}
@keyframes ring{from{width:20px;height:6px;opacity:1}to{width:300px;height:60px;opacity:0}}
/* Meldungen im Flug (lSay, lCount): Schild mit Symbol und Wort, großer Text, leuchtende Linie */
#lText{position:absolute;left:0;right:0;top:17%;display:flex;justify-content:center;text-align:center;padding:0 16px;pointer-events:none}
#lText[data-k=done]{top:7%}
@media (max-aspect-ratio:1/1){#lText[data-k=done]{top:15%}} /* Hochformat (Tablet): unter der Höhen-Anzeige */
#lText.cd{top:3%} /* Countdown am Startplatz: ganz oben im Himmel, nicht über dem Turm */
.ev{display:flex;flex-direction:column;align-items:center}
.evl{display:flex;align-items:center;gap:10px;padding:5px 14px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cy);background:#03060ac0;border:1px solid var(--line);animation:evFade .25s both}
.evl .ic{width:16px;height:16px}
.evt{margin-top:12px;font-size:clamp(2.2rem,5.4vw,4rem);font-weight:800;line-height:1.08;color:#fff;
  text-shadow:0 2px 0 #0007,0 0 6px #0009,0 0 28px #000a;animation:evReveal .35s .05s cubic-bezier(.2,.8,.2,1) both} /* schnell: manche Meldungen stehen nur 0,9 s */
.evt .acc{color:var(--cy);text-shadow:0 2px 0 #0007,0 0 6px #0009,0 0 24px #62e3ff99}
.evu{height:2px;width:220px;margin-top:14px;background:linear-gradient(90deg,#0000,var(--cy),#0000);animation:evGrow .5s .2s both}
.ev-start .evt{font-size:clamp(3rem,7.5vw,6rem);letter-spacing:.02em}
.ev-start .evl{color:var(--amber);border-color:#ffb54766}
.ev-start .evu{background:linear-gradient(90deg,#0000,var(--amber),#0000)}
.ev-warn .evl{color:var(--red);border-color:#ff5a6a77}
.ev-warn .evu{background:linear-gradient(90deg,#0000,var(--red),#0000)}
.ev-land .evl{color:var(--go);border-color:#3cf2a066}
.ev-land .evu{background:linear-gradient(90deg,#0000,var(--go),#0000)}
/* clip-path endet weit außerhalb, damit der Schatten der Schrift nicht als dunkles Kästchen abgeschnitten wird */
@keyframes evReveal{from{clip-path:inset(-50% 100% -50% -50%);transform:translateX(-12px)}to{clip-path:inset(-50% -50% -50% -50%);transform:none}}
@keyframes evFade{from{opacity:0;transform:translateY(-6px)}}
@keyframes evGrow{from{transform:scaleX(0)}}
/* Bauchbinde in den Nahaufnahmen der Trennungen (playLaunch: l3Say): klein unten in der Mitte, Schild in Cyan + kurzer Text */
#l3{position:absolute;left:50%;bottom:7%;display:flex;align-items:stretch;pointer-events:none;opacity:0;
  transform:translate(-50%,10px);transition:opacity .25s,transform .25s cubic-bezier(.2,.8,.2,1)}
#l3.on{opacity:1;transform:translate(-50%,0)}
#l3 .l3k{display:flex;align-items:center;gap:7px;padding:6px 11px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#03121a;background:var(--cy)}
#l3 .l3k .ic{width:14px;height:14px}
#l3 .l3t{display:flex;align-items:center;padding:5px 16px;font-size:clamp(15px,1.9vw,20px);font-weight:800;color:#fff;white-space:nowrap;
  background:#03060ad8;border:1px solid var(--line);border-left:0;box-shadow:inset 0 -2px 0 #62e3ff55}
#launch.build #l3{display:none}
.cdl{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px #000}
.cdl span{width:60px;height:1px;background:#ffffffaa;box-shadow:0 1px 3px #0008}
.cdn{font-size:clamp(5rem,11vw,8.25rem);font-weight:800;line-height:1;color:#fff;text-shadow:0 0 30px #62e3ff88,0 4px 18px #0008;animation:tick 1s ease-out both}
.cdn em{font-style:normal;font-size:.41em;color:var(--cy);margin-right:8px;letter-spacing:-.02em;text-shadow:0 2px 8px #000a}
@keyframes tick{0%{opacity:.35;transform:scale(1.06)}15%{opacity:1;transform:none}}
.cdt{display:flex;gap:5px}.cdt i{width:22px;height:4px;background:#ffffff50}.cdt i.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
/* Zielrahmen um den Planeten bei der Ankunft */
.reticle{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:lock 1s cubic-bezier(.2,.8,.2,1) both}
.reticle i{position:absolute;width:56px;height:56px;border:2px solid var(--cy);filter:drop-shadow(0 0 6px #62e3ff)}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.rlab{position:absolute;right:4px;top:66px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);white-space:nowrap;text-shadow:0 1px 4px #000}
@keyframes lock{from{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
@media (max-aspect-ratio:1/1){.rlab{right:auto;left:4px}}
/* Rahmen-Ecken am Bildschirmrand im Flug */
#hframe{position:absolute;inset:10px;pointer-events:none;--k:#ffffffa8;
  background:
   linear-gradient(var(--k),var(--k)) left top/44px 2px no-repeat,linear-gradient(var(--k),var(--k)) left top/2px 44px no-repeat,
   linear-gradient(var(--k),var(--k)) right top/44px 2px no-repeat,linear-gradient(var(--k),var(--k)) right top/2px 44px no-repeat,
   linear-gradient(var(--k),var(--k)) left bottom/44px 2px no-repeat,linear-gradient(var(--k),var(--k)) left bottom/2px 44px no-repeat,
   linear-gradient(var(--k),var(--k)) right bottom/44px 2px no-repeat,linear-gradient(var(--k),var(--k)) right bottom/2px 44px no-repeat}
/* Höhen-Anzeige (setAlt): HÖHE groß, darunter ZIEL und Balken */
#alt{--gl:rgba(6,12,19,.72);position:absolute;left:24px;top:24px;width:250px;padding:12px 16px 14px}
#alt.off,#launch.build #alt,#launch.build #hframe{display:none}
.hl,.hl2{display:flex;align-items:center;gap:8px}
.live{width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:auto;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hv{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px;white-space:nowrap}
.hv b{font-size:2.6rem;line-height:1;color:var(--ink);text-shadow:0 0 18px #62e3ff55}
.hv em{font-style:normal;font-weight:700;color:var(--cy);font-size:1rem}
.hl2 span{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:4px;background:#ffffff1a;margin-top:6px}
.track i{display:block;height:100%;width:0;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#skipBtn,#ffBtn{--gl:rgba(6,12,19,.72);position:absolute;right:24px;top:24px;display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:10px 16px;
  font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#ffBtn{top:82px}
#skipBtn .ic,#ffBtn .ic{width:18px;height:18px;color:var(--cy)}
#skipBtn:hover,#ffBtn:hover{background-color:#62e3ff30}
#ffBtn em{font-style:normal;color:var(--cy)}
/* Mitspielen im Flug (playLaunch: Notfall Triebwerksausfall, Stufentrennung tippen): Kasten unten in der Mitte über der Bauchbinde,
   beim Notfall große Halte-Knöpfe links/rechts (Tablet: gedrückt halten; PC: Pfeiltasten oder A/D) */
.empanel{--gl:rgba(6,12,19,.86);position:absolute;left:50%;bottom:calc(7% + 64px);transform:translateX(-50%);width:min(440px,calc(100% - 32px));
  padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.empanel.warn{--c:var(--red);--bl:#ff5a6a77}
.emh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.empanel.warn .emh{color:var(--red)}
.emh .ic{width:16px;height:16px}
.emh .live{margin-left:auto}
.emt{font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:800;line-height:1.15;color:#fff}
.emt b{color:var(--amber)}
.emk{font-size:.8rem;color:var(--mut)}
.emk kbd{display:inline-block;min-width:22px;padding:1px 6px;margin:0 2px;border:1px solid var(--line);border-bottom-width:2px;font:inherit;font-weight:800;color:var(--ink);text-align:center}
/* Neigungs-Anzeige: grün = gerade, rot = kippt um; Nadel zeigt die Neigung */
.emg{position:relative;height:26px;background:linear-gradient(90deg,#ff5a6a66,#ffb54744 22%,#3cf2a055 38% 62%,#ffb54744 78%,#ff5a6a66);border:1px solid var(--line)}
.emg i{position:absolute;top:-5px;bottom:-5px;left:50%;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 10px #fff,0 0 3px #000}
.emg.bad i{background:var(--red);box-shadow:0 0 12px var(--red)}
.emg::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#3cf2a0aa}
.emtime{height:5px;background:#ffffff1a}
.emtime i{display:block;height:100%;width:100%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
/* Zeitbalken der Stufentrennung: Markierung läuft, grüner Bereich = jetzt tippen */
.tapbar{position:relative;height:30px;background:#ffffff14;border:1px solid var(--line)}
.tapbar .zone{position:absolute;top:0;bottom:0;background:#3cf2a055;border-left:2px solid var(--go);border-right:2px solid var(--go)}
.tapbar .zone::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--go)}
.tapbar i{position:absolute;top:-5px;bottom:-5px;left:0;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 10px #fff,0 0 3px #000}
.tapgo{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:12px;font-weight:800;font-size:1.15rem;letter-spacing:.05em;
  text-transform:uppercase;color:#031a12;background:linear-gradient(#8dffd0,#3cf2a0 55%,#16b874);box-shadow:0 6px 0 #0b6b44,0 0 22px #3cf2a066,inset 0 2px 0 #ffffffaa;touch-action:none}
.tapgo:active{transform:translateY(5px);box-shadow:0 1px 0 #0b6b44,0 0 14px #3cf2a066,inset 0 2px 0 #ffffffaa}
.tapgo .ic{width:24px;height:24px;stroke-width:2}
.empanel .res{font-size:1.5rem;font-weight:800;text-align:center;color:var(--go)}
.empanel .res.meh{color:var(--amber)}
.empad{--gl:rgba(6,12,19,.72);position:absolute;bottom:24px;width:clamp(116px,17vw,170px);height:clamp(116px,17vw,170px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
.empad .ic{width:52%;height:52%;stroke-width:2;color:var(--cy)}
.empad.l{left:84px}.empad.l .ic{transform:scaleX(-1)}
.empad.r{right:24px}
.empad.need{--c:var(--amber);--bl:var(--amber);animation:padNeed .7s ease-in-out infinite}
.empad.need .ic{color:var(--amber)}
.empad.on{background-color:#62e3ff40;transform:scale(.96)}
@keyframes padNeed{50%{box-shadow:0 0 26px #ffb547aa}}
@media (max-width:900px){.empanel{bottom:calc(24px + clamp(116px,17vw,170px) + 18px)}} /* schmal (Tablet hochkant): Kasten über den Knöpfen */
/* Schnellstart mit Notfall (hl0.17): Alarm-Knopf oben, rot und blinkend, über allem */
#alarm{position:fixed;inset:0;z-index:40;background:#03060aa8;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.alarmbtn{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:min(560px,100%);padding:18px 22px 16px;border-radius:14px;color:#fff;text-align:center;
  background:linear-gradient(#ff7a86,#ff3347 55%,#c8102e);box-shadow:0 7px 0 #7a0a1a,0 0 34px #ff334799,inset 0 2px 0 #ffffff88;animation:alarmBlink .8s steps(1) infinite;touch-action:manipulation}
.alarmbtn:active{transform:translateY(6px);box-shadow:0 1px 0 #7a0a1a,0 0 20px #ff334799,inset 0 2px 0 #ffffff88;animation:none}
.alarmbtn .ah{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(1.4rem,3.4vw,2rem);font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 #0005}
.alarmbtn .ah .ic{width:34px;height:34px;stroke-width:2}
.alarmbtn .as{font-size:1.05rem;font-weight:700}
.alarmbtn .at{height:6px;background:#0004;border-radius:3px;overflow:hidden}
.alarmbtn .at i{display:block;height:100%;width:100%;background:#fff;transform-origin:left}
.alarmwait{--c:var(--amber);--bl:#ffb54766;--gl:rgba(6,12,19,.92);display:flex;align-items:center;gap:12px;padding:12px 18px;font-weight:600;animation:toastIn .35s cubic-bezier(.2,.8,.2,1)}
.alarmwait>.ic{width:22px;height:22px;color:var(--amber)}
.alarmwait b{color:var(--amber)}
/* Notfall-Katalog (hl0.16): Füllstände, Bolzen/Rüttel-Punkte, Lecks an der Rakete, Kabinen-Kamera (Feuer, Luftleck), Satellit, Kapsel */
.embar{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.embar>span{width:96px;flex:none}
.embar>div{flex:1;height:14px;background:#ffffff14;border:1px solid var(--line)}
.embar i{display:block;height:100%;width:100%;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.embar.heat i{width:0;background:linear-gradient(90deg,var(--amber),var(--red));box-shadow:0 0 10px var(--red)}
.embar.low>span{color:var(--red)}
.embar.low i{animation:barLow .5s steps(1) infinite}
@keyframes barLow{50%{opacity:.35}}
.bolts{display:flex;gap:6px}
.bolts i{flex:1;height:18px;border-radius:9px;border:2px solid var(--line);background:#ffffff10;transition:background .1s}
.bolts i.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px var(--amber)}
.tapgo.hot{color:#2a0606;background:linear-gradient(#ffb7a6,#ff6a4a 55%,#d8321e);box-shadow:0 6px 0 #7a1a0c,0 0 22px #ff6a4a66,inset 0 2px 0 #ffffffaa}
.tapgo.hot:active{box-shadow:0 1px 0 #7a1a0c,0 0 14px #ff6a4a66,inset 0 2px 0 #ffffffaa}
/* Leck an der Rakete: großes Tippziel (folgt der Rakete), Gas zischt zur Seite; zu = grün */
.leak{position:fixed;left:0;top:0;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:3px dashed var(--amber);background:#ffb54730;
  display:grid;place-items:center;touch-action:none;z-index:2;animation:padNeed .7s ease-in-out infinite}
.leak>.ic{width:34px;height:34px;color:var(--amber);stroke-width:2;position:relative;filter:drop-shadow(0 0 3px #000a)}
.leak .spray{position:absolute;left:50%;top:50%;width:150px;height:46px;margin-top:-23px;transform-origin:0 50%;transform:scaleX(var(--sd));pointer-events:none;
  background:radial-gradient(ellipse at 0 50%,#fff,#d8ecff 22%,#9fc8eecc 45%,#9fc8ee00 72%);filter:blur(1.5px) drop-shadow(0 0 2px #2a4a6a);animation:spray .16s linear infinite alternate}
@keyframes spray{to{opacity:.55;transform:scaleX(var(--sd)) scaleY(1.35)}}
.leak.shut{border-style:solid;border-color:var(--go);background:#3cf2a033;animation:none}
.leak.shut>.ic{color:var(--go);transform:rotate(90deg);transition:transform .25s}
.leak.shut .spray{display:none}
/* Kabinen-Kamera: Bullauge, Sitze; Flammen (Tippziele) und Rauch */
.cabin{position:relative;height:clamp(150px,24vh,210px);border:1px solid var(--line);overflow:hidden;touch-action:none;
  background:radial-gradient(circle at 50% 30%,#2a3f52,#0d1720 72%)}
.cabin::before{content:"Kamera Kabine";position:absolute;left:8px;top:6px;z-index:1;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.cabin .port{position:absolute;left:50%;top:12%;width:24%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:6px solid #5b6b78;
  background:radial-gradient(circle at 35% 35%,#2a78c0,#04121f 72%)}
.cabin .seat{position:absolute;bottom:0;width:22%;height:40%;border-radius:40% 40% 6px 6px;background:linear-gradient(#45535e,#26313a)}
.cabin .smk{position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,#6a625a,#2a2624 80%);opacity:0;pointer-events:none;transition:opacity .5s}
.ffl{position:absolute;width:66px;height:74px;margin:-44px 0 0 -33px;touch-action:none;z-index:1}
.ffl i{position:absolute;left:50%;bottom:4px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;transform-origin:50% 100%;animation:flk .22s ease-in-out infinite alternate;
  background:radial-gradient(ellipse at 50% 82%,#fff6c0,#ffb020 42%,#ff4a1a 72%,#ff4a1a00)}
.ffl i:nth-child(1){width:44px;height:62px;margin-left:-22px}
.ffl i:nth-child(2){width:28px;height:42px;margin-left:-30px;animation-delay:-.1s}
.ffl i:nth-child(3){width:26px;height:38px;margin-left:2px;animation-delay:-.17s}
@keyframes flk{to{transform:scale(1.1,.88) skewX(5deg)}}
.ffl.out{pointer-events:none}
.ffl.out i{animation:none;transition:transform .35s,opacity .35s;transform:scale(.2);opacity:0}
.ffl.out::after{content:"";position:absolute;left:50%;bottom:6px;width:70px;height:50px;margin-left:-35px;border-radius:50%;
  background:radial-gradient(#ffffffee,#ffffff00 70%);animation:foam .5s ease-out forwards}
@keyframes foam{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
/* Luftleck: Wandplatten, eine zischt (Gas-Striche), Flicken wächst mit jedem Tippen */
.cabin.walls{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:6px;padding:24px 8px 8px}
.wall{position:relative;border:1px solid #ffffff22;background:linear-gradient(#34424d,#222c34);touch-action:none;overflow:hidden}
.wall::before{content:"";position:absolute;inset:6px;border:1px dashed #ffffff14}
.wall.no{animation:wallNo .3s}
@keyframes wallNo{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.wall .gs{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:radial-gradient(#fff,#dff0ff 45%,#dff0ff00 72%);opacity:0}
.wall.lk{box-shadow:inset 0 0 18px #bfe3ff40}
.wall.lk .gs{animation:gas .5s linear infinite}
.wall.lk .gs:nth-child(2){animation-delay:-.17s;--gx:-40px;--gy:-12px}
.wall.lk .gs:nth-child(3){animation-delay:-.34s;--gx:34px;--gy:-24px}
@keyframes gas{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--gx,8px)),calc(-50% + var(--gy,-34px))) scale(4.5);opacity:0}}
.wall .patch{position:absolute;left:50%;top:50%;width:62%;height:62%;transform:translate(-50%,-50%) rotate(-8deg) scale(var(--p,0));border-radius:3px;
  background:repeating-linear-gradient(90deg,#cfc7aa 0 6px,#b4ac90 6px 8px);box-shadow:0 2px 4px #0008;transition:transform .2s}
/* Satellit mit klemmendem Panel: linker Flügel offen, rechter ruckelt (--wr), das Ganze wackelt beim Rütteln */
.sat.half .wl{transform:none;opacity:1}
.sat.half .fd{opacity:0}
.sat.half .wr{opacity:1;transform:scaleX(var(--wr,.08));transition:transform .2s}
.sat .satm{transition:rotate .15s ease-out}
/* Kapsel: verhedderter Hauptschirm flattert */
.cpk .chu.tangle .rf{animation:tangle .28s ease-in-out infinite alternate}
@keyframes tangle{from{transform:rotate(-8deg) scaleX(.85)}to{transform:rotate(8deg) scaleX(1.05)}}
@media (prefers-reduced-motion:reduce){.alarmbtn,.empad.need{animation:none}}
@keyframes alarmBlink{50%{background:linear-gradient(#b81e30,#8a0d1d 55%,#5e0613);box-shadow:0 7px 0 #4a0510,0 0 10px #ff334744,inset 0 2px 0 #ffffff44}}
/* Bauen draußen auf dem Startplatz: #launch mit Klasse "build" ist die Bau-Szene; Kästchen mit Preisen, Linien zu den Teilen */
#bscene{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#launch.build #bscene{opacity:1}
#launch:not(.build) #bscene *{pointer-events:none!important}
#launch.build #skipBtn,#launch.build #ffBtn,#launch.build #flame{display:none}
.blines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.blines path{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 4;filter:drop-shadow(0 0 2px #000) drop-shadow(0 1px 1px #000a)}
.blines rect{fill:var(--amber);stroke:#000;stroke-width:1}
.blines .built{stroke:var(--go);stroke-dasharray:none}
.blines rect.built{fill:var(--go)}
.blines .poor{stroke:var(--red)}
.blines rect.poor{fill:var(--red)}
.bhud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;flex-wrap:wrap}
.bpanel{--gl:rgba(6,12,19,.8);pointer-events:auto;padding:14px 16px}
.bpanel.binfo{max-width:min(440px,52%)}
#launch.build #rocketSvg img[src$="_ghost.png"]{filter:brightness(1.7) drop-shadow(0 0 2px #000c)}
.binfo h2{margin:6px 0 0;font-size:2rem;line-height:1.1}
.binfo .badges{margin:10px 0 4px}
.binfo .small{margin-top:6px;font-size:.85rem}
.bact{display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:min(380px,44%);margin-left:auto}
.bact .row{display:flex;gap:10px;align-items:center}
.bact .iconbtn{pointer-events:auto}
/* Geld-Anzeige in der Bau-Szene */
.moneyp{display:flex;align-items:center;gap:10px;padding:7px 16px}
.moneyp .ic{width:24px;height:24px;color:var(--amber)}
.moneyp span{display:flex;flex-direction:column;line-height:1.05}
.moneyp b{font-size:1.5rem;color:var(--amber)}
/* Hinweis (Bernstein) und Warten (Cyan) */
.hint{--c:var(--amber);--bl:#ffb54744;display:flex;gap:10px;align-items:flex-start;font-size:.9rem;text-align:left;color:#e6eef5}
.hint>.ic{width:20px;height:20px;margin-top:1px;color:var(--amber)}
.hint b{color:var(--amber);white-space:nowrap}
.hint.wait>.ic,.hint.wait b{color:var(--cy)}
.hint.wait{--c:var(--cy);--bl:var(--line)}
/* Start-Pult: Warnstreifen-Rahmen, dicker Start-Knopf mit Drück-Gefühl */
.launchp{pointer-events:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px;min-width:300px;padding:14px;border:6px solid transparent;
  background:linear-gradient(#0a121cf0,#060b12f0) padding-box,repeating-linear-gradient(-45deg,var(--amber) 0 12px,#0b0f14 12px 24px) border-box;box-shadow:0 10px 30px #0008}
.rh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--go)}
.led{width:8px;height:8px;background:var(--go);box-shadow:0 0 8px var(--go);animation:blink 1.2s steps(2) infinite}
.gobtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:66px;padding:16px 16px 15px;border-radius:12px;white-space:nowrap;
  font-weight:800;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;color:#2a0f00;text-shadow:0 1px 0 #fff6;
  background:linear-gradient(#ffc56a,#ff8a1f 55%,#e85d00);box-shadow:0 6px 0 #9a3a00,0 0 26px #ff7a1a88,inset 0 2px 0 #ffffffaa;
  animation:goPulse 1.6s ease-in-out infinite;margin-bottom:6px}
.gobtn .ic{width:24px;height:24px;stroke-width:2}
@media (max-width:900px){.gobtn{font-size:1.02rem}}
.gobtn:hover{filter:brightness(1.08)}
.gobtn:active{transform:translateY(5px);box-shadow:0 1px 0 #9a3a00,0 0 18px #ff7a1a88,inset 0 2px 0 #ffffffaa;animation:none}
/* Ziel wählen im Start-Pult (8b1.8): oben das weiteste Ziel, gewählt = Cyan; Spalten Ziel | Geld | Klappt */
.dpick{display:flex;flex-direction:column;gap:3px;margin-top:-4px}
.dph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 1px}
.drow{display:grid;grid-template-columns:1fr 84px 58px;gap:6px;align-items:center;min-height:27px;padding:2px 10px;text-align:left;font-size:.86rem;
  background:#62e3ff0a;box-shadow:inset 0 0 0 1px var(--line);color:#c9d6e0}
.drow:hover:not(:disabled):not(.on){background:#62e3ff1f}
.drow.on{background:#62e3ff2a;box-shadow:inset 0 0 0 2px var(--cy),0 0 12px #62e3ff33;color:#fff}
.drow:disabled{cursor:default}
.drow .dn{display:flex;align-items:center;gap:7px;font-weight:700;min-width:0}
.drow .dn>.ic{color:var(--cy)}
.drow .dm{display:grid;place-items:center;width:20px;height:20px;flex:none;color:var(--amber);border:1px solid #ffb54788;border-radius:50%}
.drow .dm .ic{width:12px;height:12px}
.drow .dc,.drow .dp{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-weight:800}
.drow .dc{color:var(--amber)}
.drow .dp{color:var(--go);font-weight:700}
.dtip{display:flex;align-items:center;gap:5px;font-size:.78rem;color:#c9d6e0;white-space:nowrap}
.dtip .ic{color:var(--amber)}
.dtip b{color:var(--amber)}
.dtip.safe .ic,.dtip.safe b{color:var(--go)}
@keyframes goPulse{50%{box-shadow:0 6px 0 #9a3a00,0 0 40px #ff7a1acc,inset 0 2px 0 #ffffffaa}}
/* Kästchen für die Teile: Bernstein = kaufen, Grün = gebaut, Rot = zu teuer */
.pbox{--c:var(--amber);--bl:#ffb54766;--gl:rgba(6,12,19,.84);position:absolute;left:0;top:0;pointer-events:auto;min-width:150px;max-width:220px;min-height:48px;
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 14px 8px;text-align:left}
.pbox:hover:not(:disabled){background-color:#2a1d08e6}
.pbox .pn{font-weight:800;font-size:.9rem}
.pbox .pc{display:flex;align-items:center;gap:6px;color:var(--amber);font-weight:800;font-size:1.05rem}
.pbox.built{--c:var(--go);--bl:#3cf2a044;min-height:0;padding:5px 12px 6px;cursor:default}
.pbox.built .pc{color:var(--go);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.pbox.poor{--c:var(--red);--bl:#ff5a6a66}
.pbox.poor .pc{color:var(--red)}
#bscene.intro .pbox{animation:pbIn .45s backwards}
#bscene.intro .blines{animation:pbFade .6s .5s backwards}
@keyframes pbIn{from{opacity:0;transform:translateX(-40px) scale(.6)}}
@keyframes pbFade{from{opacity:0}}

#toast{--c:var(--amber);--bl:#ffb54766;--gl:rgba(6,12,19,.92);position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:12px 18px;z-index:50;font-weight:600;width:max-content;max-width:min(560px,calc(100% - 32px));text-align:left;animation:toastIn .35s cubic-bezier(.2,.8,.2,1)}
#toast>.ic{width:22px;height:22px;color:var(--amber)}
#toast b{color:var(--amber);white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
#sndBtn{--gl:rgba(6,12,19,.72);position:fixed;left:14px;bottom:14px;z-index:60;width:52px;height:52px;display:grid;place-items:center}
#sndBtn .ic{width:24px;height:24px;color:var(--cy)}
#sndBtn:hover{background-color:#62e3ff30}
footer{text-align:center;padding:20px}
footer button{min-height:44px;padding:10px 14px;color:var(--mut);font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
footer button:hover{color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="ic logo" aria-hidden="true"><use href="#i-rocket"/></svg>
    <div><h1>Raketen mit Karten</h1><small class="lbl">Sammeln · Bauen · Starten</small></div></div>
  <div class="stats">
    <div class="stat money"><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span><small class="lbl">Geld</small><b id="money"></b></span></div>
    <div class="stat"><svg class="ic" aria-hidden="true"><use href="#i-rocket"/></svg><span><small class="lbl">Raketen</small><b id="prog"></b></span></div>
    <button class="stat" id="winsStat" onclick="showTrophies()"><span><small class="lbl">Pokale</small><b id="wins"></b></span></button>
  </div>
</header>
<nav>
  <button id="tabBoxes" class="active" onclick="setTab('boxes')"><svg class="ic" aria-hidden="true"><use href="#i-box"/></svg>Glücksboxen</button>
  <button id="tabHangar" onclick="setTab('hangar')"><svg class="ic" aria-hidden="true"><use href="#i-hangar"/></svg>Hangar</button>
</nav>
<main>
  <section id="boxesView"></section>
  <section id="hangarView" class="hidden"></section>
</main>
<footer><button onclick="resetGame()">Spiel ganz von vorne beginnen</button></footer>

<div id="modal" class="overlay hidden" onclick="if(event.target===this)bgClose()"><div class="dialog" id="modalBody"></div></div>

<div id="launch" class="hidden">
  <div id="shk"><!-- Flugbild: wackelt beim Start (playLaunch: shake); Anzeigen und Knöpfe liegen außerhalb und bleiben ruhig -->
  <div id="sky"></div><div id="bgFar"></div><div id="sun"></div><div id="clb"></div><div id="space"></div><div id="stars"></div>
  <div id="goal"></div>
  <div id="ground"></div>
  <canvas id="plume"></canvas>
  <div id="fxb"></div>
  <div id="rw"><div id="rocketSvg"></div><div id="flame"></div></div>
  <div id="steam"></div>
  <div id="clf"></div>
  <canvas id="boomgl"></canvas>
  <div id="fx"></div>
  </div>
  <div id="hframe"></div>
  <div id="lText"></div>
  <div id="l3"></div>
  <div id="alt" class="off">
    <div class="hl"><small>Höhe</small><span class="live"></span></div>
    <div class="hv"><b id="altV"></b><em id="altU"></em></div>
    <div class="hl2"><small>Ziel</small><span id="altD"></span></div>
    <div class="track"><i id="altBar"></i></div>
  </div>
  <button id="skipBtn"><svg class="ic" aria-hidden="true"><use href="#i-skip"/></svg>Überspringen</button>
  <button id="ffBtn"></button>
  <div id="emUi"></div><!-- Mitspielen im Flug: Notfall-Anzeige mit Halte-Knöpfen bzw. Zeitbalken der Stufentrennung (playLaunch) -->
  <div id="bscene"></div>
</div>
<div id="toast" class="hidden"></div>
<div id="alarm" class="hidden"></div><!-- Schnellstart mit Notfall: Alarm-Knopf (alarm) -->
<button id="sndBtn" onclick="sfx.toggle()" aria-label="Ton an oder aus"></button>

<script>
// ===================== Symbole =====================
// Eigene Symbole statt Emojis (Stil "Mission Control", hl0.27): 24×24, Linien; Teile mit class "f" sind Flächen (leicht gefüllt, --fo).
// ic('coin') gibt ein <svg> zurück, das das Symbol aus dem Sprite (#i-coin) benutzt; in festem HTML: <svg class="ic"><use href="#i-coin"/></svg>
const ICONS={
 rocket:'<path class="f" d="M12 2c3 2.5 4.5 6 4.5 10v5h-9v-5C7.5 8 9 4.5 12 2z"/><path d="M7.5 12.5 4.5 16v3h3M16.5 12.5l3 3.5v3h-3"/><circle cx="12" cy="9" r="1.7"/><path d="M10 19.5l2 2.7 2-2.7"/>',
 flame:'<path class="f" d="M12 2c1 4 5.5 5.5 5.5 11.5a5.5 5.5 0 0 1-11 0c0-3 1.5-4.8 2.6-6.3.3 2.1 1.2 3.1 2.3 3.4C11 8 11 5 12 2z"/><path d="M12 14c1 1.2 2.1 2 2.1 3.4a2.1 2.1 0 0 1-4.2 0c0-1 .9-2.1 2.1-3.4z"/>',
 sat:'<rect class="f" x="9" y="8" width="6" height="8" rx=".8"/><rect x="1.5" y="9.5" width="6" height="5"/><rect x="16.5" y="9.5" width="6" height="5"/><path d="M4.5 9.5v5M19.5 9.5v5M7.5 12H9M15 12h1.5M12 8V4.5"/><circle cx="12" cy="3.5" r="1"/>',
 target:'<circle cx="12" cy="12" r="8.5"/><circle class="f" cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>',
 planet:'<circle class="f" cx="12" cy="12" r="6"/><path d="M6.4 14.3C3.3 16.2 2 18 3 19c1.6 1.6 7.6-.6 12.6-4.4s8-8.7 6.4-10.3c-.8-.8-2.6-.4-4.9.8"/>',
 moon:'<path class="f" d="M15.5 3.2A9 9 0 1 0 20.8 15 7.5 7.5 0 0 1 15.5 3.2z"/>',
 sun:'<circle class="f" cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',
 coin:'<ellipse class="f" cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>',
 snd:'<path class="f" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
 sndoff:'<path class="f" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/>',
 ff:'<path class="f" d="M2.5 6l8.5 6-8.5 6zM12 6l8.5 6L12 18z"/>',
 skip:'<path class="f" d="M4 5.5l10 6.5-10 6.5z"/><path d="M18.5 5.5v13"/>',
 play:'<path class="f" d="M7 4.5l12.5 7.5L7 19.5z"/>',

for(const r of ROCKETS){
  r.stages=r.stages||2; r.h=r.h||1; r.w=r.w||1;
  // Weniger Fehlstarts: echte Werte (50–98 %) werden auf 90–99 % umgerechnet.
  // Unsichere Raketen bleiben etwas riskanter, aber jede klappt mindestens 9 von 10 Mal.
  r.chance=Math.min(.99,.9+.2*(r.chance-.5));
  const p=[];
  p.push({k:'s1',n:r.s1name||'Haupt-Booster',wt:4});
  p.push({k:'eng',n:'Triebwerke',wt:2});
  if(r.side) p.push({k:'side',n:'Seitenbooster',wt:2.5});
  if(r.stages>=2) p.push({k:'s2',n:'Zweite Stufe',wt:2});
  if(r.stages>=3) p.push({k:'s3',n:'Dritte Stufe',wt:1.5});
  p.push({k:'top',n:r.top||(r.crew?'Kapsel':'Satellit + Spitze'),wt:1.5});
  if(r.tower) p.push({k:'tower',n:'Rettungsturm',wt:.8});
  const total=TIERS[r.tier].cost*Math.sqrt(r.h*r.w);
  const sum=p.reduce((a,b)=>a+b.wt,0);
  p.forEach(x=>x.cost=round10(total*x.wt/sum));
  r.parts=p;
  r.cost=p.reduce((a,b)=>a+b.cost,0);
  r.reward=round10(r.cost*(r.reuse?0.75:2.0)); // Höchstbetrag, wenn sie ganz hoch fliegt
  [r.alt,r.dest]=ALT[r.id];
  r.landParts=r.id==='fheavy'?['s1','eng','side']:['s1','eng'];
}
