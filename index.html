function shade(hex,f){const n=parseInt(hex.slice(1),16),c=v=>Math.min(255,v*f|0);return `rgb(${c((n>>16)&255)},${c((n>>8)&255)},${c(n&255)})`;}
function rocketGeom(r,built,o={}){
  const anchors={}; // wo die Bau-Kästchen hinzeigen
  const has=k=>built==='all'||built.has(k);
  const W=r.w,H=r.h,CW=26*W,E=12,body=r.c[0],acc=r.c[1];
  const back=[],mid=[],front=[];
  let maxX=CW/2,topY=-E;
  const add=(arr,k,fill,fn)=>{
    let a;
    if(has(k)) a=`fill="${fill}" stroke="rgba(0,0,0,.35)" stroke-width="1"`;
    else if(o.hideUnbuilt) return;
    else a=`fill="rgba(255,255,255,.08)" stroke="#8fa3c8" stroke-width="2" stroke-dasharray="5 4"`;
    arr.push(fn(a));
  };
  const deco=(arr,k,s)=>{if(has(k))arr.push(s);};
  const H1=110*H;
  // Seitenbooster
  if(r.side){
    const SW=CW*(r.sw||.45),SH=H1*(r.sh||.7),cone=SW*1.3,pairs=r.side>=4?2:1,sc=r.sc||body;
    for(let p=pairs-1;p>=0;p--){
      const off=p?CW/2+SW*.95:CW/2+SW/2-.5, fill=p?shade(sc,.78):sc;
      for(const s of [-1,1]){
        const cx=s*off,x=cx-SW/2,y=-E-SH;
        add(back,'side','#4b4b4b',a=>`<path d="M${cx-SW*.3} ${-E} L${cx-SW*.42} 0 L${cx+SW*.42} 0 L${cx+SW*.3} ${-E} Z" ${a}/>`);
        add(back,'side',fill,a=>`<path d="M${x} ${-E} L${x} ${y} Q${x} ${y-cone} ${cx} ${y-cone} Q${x+SW} ${y-cone} ${x+SW} ${y} L${x+SW} ${-E} Z" ${a}/>`);
        topY=Math.min(topY,y-cone);
      }
      maxX=Math.max(maxX,off+SW/2);
    }
    anchors.side={y:-E-SH/2,x:maxX};
  }
  // Triebwerke
  const nb=Math.max(1,Math.round(W*2.5)),bw=CW/nb;
  for(let i=0;i<nb;i++){const bx=-CW/2+i*bw;
    add(mid,'eng','#3d3d3d',a=>`<path d="M${bx+bw*.2} ${-E} L${bx+bw*.04} 0 L${bx+bw*.96} 0 L${bx+bw*.8} ${-E} Z" ${a}/>`);}
  // Haupt-Booster
  let y=-E,cw=CW;
  anchors.eng={y:-E/2,x:CW/2};anchors.s1={y:-E-H1/2,x:CW/2};
  add(mid,'s1',body,a=>`<rect x="${-CW/2}" y="${y-H1}" width="${CW}" height="${H1}" ${a}/>`);
  deco(mid,'s1',`<rect x="${-CW/2}" y="${y-H1*.62}" width="${CW}" height="${Math.max(3,H1*.04)}" fill="${acc}"/>`);
  y-=H1;

// Raketen etwas pixelig machen: klein rendern, groß anzeigen
const PX_CACHE=new Map();
function pixelizeAll(root,px=3){
  root.querySelectorAll('svg.rk').forEach(svg=>{
    const rc={width:svg.clientWidth,height:svg.clientHeight};if(!rc.width||!rc.height)return;
    const w=Math.max(1,Math.round(rc.width/px)),h=Math.max(1,Math.round(rc.height/px));
    const s=svg.cloneNode(true);s.setAttribute('width',w);s.setAttribute('height',h);s.removeAttribute('style');
    const src=s.outerHTML,key=src;
    const put=url=>{if(!svg.isConnected)return;const img=new Image();img.src=url;img.className='pix';
      img.style.width=rc.width+'px';img.style.height=rc.height+'px';svg.replaceWith(img);};
    if(PX_CACHE.has(key))return put(PX_CACHE.get(key));
    const im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      const url=c.toDataURL();PX_CACHE.set(key,url);put(url);};
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  });
}

// ===================== Ton =====================
// sfx.beep(go) Countdown · engineStart()/engineStop(fade,cut) Triebwerk · boom() Explosion · stage(delay) Stufentrennung
// land() Landung · coin() Geld bekommen · pay() Geld ausgeben · boxOpen() Box auf · cardFlip(tier,delay) Karte
// fly() Anflug aufs Ziel · goal() Ziel erreicht
// sfx.play(name,vol) spielt eine Datei aus assets/audio einmal, sfx.loop(name,vol,fadeIn) immer wieder (gibt {stop(fade)} zurück).
// Triebwerk, Countdown, Stufentrennung, Fallschirm, Wasserlandung: Dateien aus dem Schwesterprojekt (assets/audio/CREDITS.md).
// Der Rest wird mit WebAudio erzeugt; das ist auch der Ersatz, wenn eine Datei fehlt oder noch lädt.
// Alles ist still, solange kein Klick war (Autoplay-Regeln), der Ton aus ist oder der Browser keinen Ton kann.
const sfx=(()=>{
  const KEY='raketen-mit-karten-ton',DIR='assets/audio/',VOL=.45;
  const FILES=['engine_rumble_loop','engine_crackle_loop','engine_hiss_loop','engine_ignition','engine_cutoff','stage_separation',
    'countdown_tick','countdown_zero','parachute_deploy','parachute_flutter_loop','splashdown','splash_slap'];
  let muted=false;try{muted=localStorage.getItem(KEY)==='aus';}catch(e){}
  let ac=null,out=null,noise=null,eng=null,engT=0,armed=false;
  const buf={},els=new Set(); // buf: Name -> AudioBuffer (über Server) oder true (file://, dann <audio>-Elemente)
  const pending=new Set();    // Töne, die später erst losgehen; Stummschalten und Überspringen brechen sie ab
  const quiet=p=>{if(p&&p.catch)p.catch(()=>{});};
  function keep(delay,h){if(delay>0){pending.add(h);if(h.addEventListener)h.addEventListener('ended',()=>pending.delete(h));}}
  function cancelPending(){pending.forEach(h=>{try{h.stop(0);}catch(e){}});pending.clear();}
  function ctx(){
    if(muted||!armed)return null; // erst nach dem ersten Klick oder Tastendruck
    try{
      if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A();
        const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
        out=ac.createGain();out.gain.value=VOL;out.connect(comp);
        noise=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
        loadAll();}
      if(ac.state==='suspended')quiet(ac.resume());
      return ac;
    }catch(e){return null;}
  }
  // Dateien laden: über einen Server per fetch (Schleifen ohne Lücke), bei file:// geht fetch nicht → <audio>-Elemente
  function loadAll(){
    if(location.protocol==='file:'){FILES.forEach(n=>{const e=new Audio();e.preload='auto';
      e.addEventListener('canplaythrough',()=>{buf[n]=true;},{once:true});e.onerror=()=>{};e.src=DIR+n+'.ogg';});return;}
    FILES.forEach(n=>fetch(DIR+n+'.ogg').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>ac.decodeAudioData(b))
      .then(b=>{buf[n]=b;}).catch(()=>{}));
  }
  // Lautstärke eines <audio>-Elements langsam ändern
  function ramp(e,to,sec,done){clearInterval(e._r);const from=e.volume,n=Math.max(1,Math.round(sec*20));let i=0;
    e._r=setInterval(()=>{i++;try{e.volume=Math.max(0,Math.min(1,from+(to-from)*i/n));}catch(err){}if(i>=n){clearInterval(e._r);done&&done();}},50);}
  // Datei abspielen; null, wenn sie (noch) nicht da ist
  function play(n,vol=1,loop=false,att=0,delay=0){
    const b=buf[n];if(!b||!ctx())return null;
    if(b===true){
      const e=new Audio(DIR+n+'.ogg');e.loop=loop;e.volume=att?0:Math.min(1,vol*VOL);
      let tid=0;const go=()=>{els.add(e);quiet(e.play());if(att)ramp(e,Math.min(1,vol*VOL),att);};
      const h={stop(f=.3){clearTimeout(tid);pending.delete(h);ramp(e,0,f,()=>{e.pause();els.delete(e);});}};
      e.onended=()=>{els.delete(e);pending.delete(h);};if(delay)tid=setTimeout(go,delay*1000);else go();
      keep(delay,h);return h;
    }
    const t=ac.currentTime+delay,s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.loop=loop;
    g.gain.setValueAtTime(att?0:vol,t);if(att)g.gain.linearRampToValueAtTime(vol,t+att);
    s.connect(g).connect(out);s.start(t);
    const h={stop(f=.3){try{const t=ac.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);
      g.gain.linearRampToValueAtTime(0,t+f);s.stop(t+f+.05);}catch(e){}}};
    s.addEventListener('ended',()=>pending.delete(h));keep(delay,h);return h;
  }
  // Bausteine: Hüllkurve, Ton (Oszillator) und gefiltertes Rauschen
  function env(g,t,att,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}
  function tone(type,f0,f1,dur,peak,delay=0){const a=ctx();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    env(g,t,.01,peak,dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.05);keep(delay,o);}
  function hiss(ft,f0,f1,q,dur,peak,delay=0,att=.01){const a=ctx();if(!a)return;const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=noise;s.loop=true;f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    env(g,t,att,peak,dur);s.connect(f).connect(g).connect(out);s.start(t);s.stop(t+dur+.05);keep(delay,s);}
  // Triebwerk: Zünden, dann drei Schleifen übereinander (Grollen + Knistern + Zischen), die langsam lauter werden
  function engineStop(fade=.5,cut=false){
    if(!eng)return;const e=eng;eng=null;clearTimeout(engT);
    try{e.stop(fade);}catch(err){}
    if(cut)play('engine_cutoff',.8);
  }
  function engineStart(){
    engineStop(.05);const a=ctx();if(!a)return;
    if(buf.engine_rumble_loop){
      const L=[play('engine_ignition',.9),play('engine_rumble_loop',1,true,.8),play('engine_crackle_loop',.45,true,1.2),play('engine_hiss_loop',.35,true,1.2)].filter(Boolean);
      eng={stop:f=>L.forEach(h=>h.stop(f))};
    } else eng=synthEngine(a);
    engT=setTimeout(()=>engineStop(1.5),40000); // Sicherheitsnetz: nie endlos dröhnen (der Aufstieg dauert bis 19 s)
  }
  // Ersatz-Triebwerk aus gefiltertem Rauschen, falls die Dateien fehlen
  function synthEngine(a){
    const t=a.currentTime;
    const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.8);g.connect(out);
    const n=a.createBufferSource();n.buffer=noise;n.loop=true;                       // Rauschen = Grollen
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=360;f.Q.value=.7;
    const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=7;lg.gain.value=110;lfo.connect(lg).connect(f.frequency);
    const o=a.createOscillator(),of=a.createBiquadFilter(),og=a.createGain();          // tiefes Brummen darunter
    o.type='sawtooth';o.frequency.value=46;of.type='lowpass';of.frequency.value=180;og.gain.value=.15;
    n.connect(f).connect(g);o.connect(of).connect(og).connect(g);
    n.start(t);o.start(t);lfo.start(t);
    return {stop(f){const t=a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+f);
      [n,o,lfo].forEach(s=>{try{s.stop(t+f+.05);}catch(err){}});}};
  }
  // Ersatz-Countdown wie make_beeps.py im Schwesterprojekt ("soft_bell"): Sinus mit zwei Obertönen, 4 ms Anstieg
  function bell(f,dur,rel){const a=ctx();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.setPeriodicWave(a.createPeriodicWave(new Float32Array([0,0,0,0]),new Float32Array([0,1,.3,.1])));o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.004);g.gain.setValueAtTime(.35,t+dur-rel);g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g).connect(out);o.start(t);o.stop(t+dur+.05);}
  const safe=fn=>(...a)=>{try{fn(...a);}catch(e){}};
  function showBtn(){const b=document.getElementById('sndBtn');if(!b)return;b.innerHTML=ic(muted?'sndoff':'snd');
    b.title=muted?'Ton ist aus – tippen zum Einschalten':'Ton ist an – tippen zum Ausschalten';}
  const api={
    beep:safe(go=>{if(!play(go?'countdown_zero':'countdown_tick',.7))go?bell(1320,.9,.6):bell(880,.25,.2);}),
    engineStart:safe(engineStart),
    engineStop:safe((fade,cut)=>{cancelPending();engineStop(fade,cut);}), // bricht auch noch nicht gestartete Töne ab
    boom:safe(()=>{engineStop(.05);hiss('lowpass',1600,80,.8,2.2,.8,0,.005);tone('sine',110,32,1.1,.8);}),
    stage:safe((delay=0)=>{if(!play('stage_separation',.8,false,0,delay)){hiss('highpass',2400,2400,.7,.1,.3,delay);
      tone('triangle',240,90,.14,.25,delay);hiss('bandpass',1400,300,1,.7,.18,delay+.06);}}),
    land:safe(()=>{engineStop(.2,true);tone('sine',90,40,.5,.7);hiss('lowpass',700,120,.7,1.4,.3,.02);}),
    // Ziel im Flug: leises Rauschen beim Hinfliegen, heller Akkord bei "Geschafft!".
    // Startzeit minimal verzögert (.01 s), damit sie in pending landen: Überspringen (finish → engineStop) bricht sie ab
    fly:safe(()=>{hiss('bandpass',220,900,1.4,3.6,.12,.01,1.6);tone('sine',110,165,3.4,.08,.01);}),
    goal:safe(()=>{[523,659,784,1047,1319].forEach((f,i)=>tone('sine',f,f,1.1-i*.1,.2,.01+i*.08));}),
    play:(n,vol=1)=>{try{return play(n,vol);}catch(e){return null;}},
    loop:(n,vol=1,att=.3)=>{try{return play(n,vol,true,att);}catch(e){return null;}},
    coin:safe(()=>{tone('triangle',988,988,.1,.45);tone('triangle',1319,1319,.4,.45,.08);}),
    tick:safe((k=0)=>{const f=1480+Math.min(k,24)*30;tone('triangle',f,f,.07,.18);}), // Münze kommt oben an (k: wievielte, wird höher)
    fix:safe(()=>{tone('triangle',520,900,.1,.3);hiss('bandpass',2600,1600,1,.14,.14);}), // Notfall: Ventil zu, Flamme gelöscht, Leck geflickt
    gas:safe((dur=.5,v=.16)=>hiss('highpass',4200,2600,.6,dur,v,.01,.05)),                 // Notfall: Gas zischt
    pay:safe(()=>{tone('triangle',660,660,.08,.4);tone('triangle',494,494,.2,.4,.07);}),
    boxOpen:safe(()=>{hiss('bandpass',300,3000,2,.5,.5);[523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,.3,.3,.1+i*.08));}),
    cardFlip:safe((tier=0,delay=0)=>{hiss('bandpass',2600,1200,1.5,.09,.7,delay);
      [784,988,1175,1568].slice(0,tier?tier+1:0).forEach((f,i)=>tone('sine',f,f,.45,.2,delay+.12+i*.07));}),
    toggle(){muted=!muted;try{localStorage.setItem(KEY,muted?'aus':'an');}catch(e){}
      if(muted){cancelPending();engineStop(.1);els.forEach(e=>{try{e.pause();}catch(err){}});els.clear();try{ac&&quiet(ac.suspend());}catch(e){}}else api.beep();
      showBtn();},
    get muted(){return muted;},
    get running(){return !!eng;},
    get loaded(){return Object.keys(buf).length;},
  };
  ['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{armed=true;ctx();},{capture:true,passive:true}));
  document.addEventListener('visibilitychange',()=>{try{els.forEach(e=>{e.muted=document.hidden;});
    if(!ac)return;if(document.hidden)quiet(ac.suspend());else if(!muted)quiet(ac.resume());}catch(e){}});
  showBtn();
  return api;
})();

// Kurze Nachricht unten; msg darf HTML enthalten (z. B. ic('coin')), icon = Symbol links
function toast(msg,icon='info'){const t=$('#toast');t.innerHTML=ic(icon)+`<span>${msg}</span>`;t.classList.remove('hidden');
  t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),3200);}
// Geldbetrag mit Münze (für Texte)
const coins=n=>`<b>${ic('coin')} ${fmt(n)}</b>`;
// Meldung im Flug (#lText): kleines Schild (Symbol o.ic + Wort o.l), großer Text m, leuchtende Linie.
// o.k = Art: info, start, goal, done, warn, land; o.h = Text als HTML (sonst m). lSay('') = weg
function lSay(m,o={}){const t=$('#lText'),k=o.k||'info';t.dataset.m=m;t.dataset.k=m?k:'';
  t.innerHTML=m?`<div class="ev ev-${k}"><div class="evl">${ic(o.ic||'info')}<span>${o.l||'Meldung'}</span></div><div class="evt">${o.h||m}</div><div class="evu"></div></div>`:'';}
// Countdown "T–3", "T–2", "T–1" mit drei Strichen
function lCount(c){const t=$('#lText');t.dataset.m=c;t.dataset.k='cd';
  t.innerHTML=`<div class="ev ev-cd"><div class="cdl"><span></span>Countdown<span></span></div><div class="cdn"><em>T–</em>${c}</div>
    <div class="cdt">${[3,2,1].map(k=>`<i class="${k>=c?'on':''}"></i>`).join('')}</div></div>`;}
// Höhen-Anzeige im Flug: txt wie "12,8 Mio. km" (null = aus), dest = Ziel, f = Balken 0..1
function setAlt(txt,dest,f){const a=$('#alt');a.classList.toggle('off',txt==null);if(txt==null)return;
  const i=txt.indexOf(' ');$('#altV').textContent=txt.slice(0,i);$('#altU').textContent=txt.slice(i+1);
  $('#altD').textContent=dest;$('#altBar').style.width=Math.max(1,Math.min(100,f*100)).toFixed(1)+'%';}

// ===================== Anzeige =====================
let tab='boxes';
function setTab(t){tab=t;$('#tabBoxes').classList.toggle('active',t==='boxes');$('#tabHangar').classList.toggle('active',t==='hangar');
  $('#boxesView').classList.toggle('hidden',t!=='boxes');$('#hangarView').classList.toggle('hidden',t!=='hangar');render();}
function render(){
  mFill();showMoney();
  $('#prog').innerHTML=`${ROCKETS.filter(unlocked).length}<em>/${ROCKETS.length}</em>`;
  const tn=trophyList().length;$('#winsStat').classList.toggle('hidden',!tn);$('#winsStat').setAttribute('aria-label',`${tn} Pokale – Regal ansehen`);

}

  <p class="tip">${ic('coin')}<span><b>Geld bekommst du, wenn du Raketen startest</b> – je höher sie fliegt, desto mehr. Tipp: Heb genug Geld auf, um deine Rakete fertig zu bauen!</span></p>
  <div class="boxes">${BOXES.map((b,i)=>`
    <div class="box" style="--bc:${b.color}">
      <div class="lb l${b.luck}" style="--lbc:${b.color};animation-delay:${-i*.7}s">${luckyBlock(b.color,b.luck)}</div>
      <div class="bxname">Glücksbox</div>
      ${stars(b.luck)}
      <div class="bxcards">${ic('cards')}${b.cards} Karten</div>
      <div class="odds">${TIERS.map((t,k)=>`<div><span><i class="dot t${k}"></i>${t.name}</span><b>${b.w[k]} %</b></div>`).join('')}</div>
      <button class="buy" ${Math.round(MR.disp)<b.price?'disabled':''} onclick="buyBox(${i})">${ic('coin')}${fmt(b.price)}</button>

function tileStatus(r){
  const n=cardsOf(r);
  if(!unlocked(r))return `<div class="st">${ic('cards')}${n}/${CARDS_NEEDED} Karten</div><div class="bar"><i style="width:${n/CARDS_NEEDED*100}%"></i></div>`;
  if(complete(r)){const c=coolLeft(r);return c?`<div class="st wait">${ic('clock')}Bereit in ${Math.ceil(c/1000)} s</div>`:`<div class="st ok">${ic('check')}Startbereit</div>`;}
  const b=builtSet(r).size;
  return `<div class="st">${ic('wrench')}${b}/${r.parts.length} Teile gebaut</div><div class="bar"><i style="width:${b/r.parts.length*100}%"></i></div>`;
}
function renderHangar(){

    const rs=ROCKETS.filter(r=>r.tier===k);

    <div class="tierHead t${k}"><i></i><h2>${t.name}</h2><span>${rs.filter(unlocked).length}/${rs.length}</span></div>
    <div class="grid">${rs.map(r=>`

        ${drawRocket(r,'all')}
        <div class="nm">${unlocked(r)||cardsOf(r)?r.name:'???'}</div>
        <div class="tst">${tileStatus(r)}</div>${unlocked(r)?holoHtml(k):''}${mTag(r)}

function clickTile(id){const r=byId(id);
  if(!unlocked(r)){toast(`Du brauchst noch ${CARDS_NEEDED-cardsOf(r)} Karte(n) für diese Rakete. Kauf Glücksboxen!`,'cards');return;}
  openBuild(r);}

// ===================== Bauen (draußen auf dem Startplatz) =====================
// Die Bau-Ansicht ist die Startplatz-Szene: #launch mit Klasse "build". Die Rakete steht an der Rampe (fehlende Teile als Umriss),
// daneben Kästchen mit Preisen, jedes mit einer Linie zu seinem Teil. Gestartet wird von hier, playLaunch übernimmt die Szene.
let cur=null;
const BS={r:null,pad:null,mood:'day',scale:1,bk:null,rt:0}; // Szene: Rakete, Startplatz (setupPad), Stimmung, Maßstab, gezeichnete Teile
const inScene=()=>$('#launch').classList.contains('build');
// keep: Stimmung behalten (nur neu aufbauen, z. B. nach Größenänderung des Fensters)
// again: zurück zur selben Rakete nach dem Start – Tag/Abend bleibt gleich, die Szene kommt aber neu herein
function openBuild(r,keep,again){
  cur=r;$('#modal').classList.add('hidden');
  if(!(keep||again)||BS.r!==r)BS.mood=Math.random()<.4?'dusk':'day';
  BS.r=r;BS.bk=null;
  const L=$('#launch'),rw=$('#rw'),holder=$('#rocketSvg');
  L.classList.remove('hidden');L.classList.add('build');
  $('#fx').innerHTML='';lSay('');setAlt(null);
  $('#flame').style.display='none';holder.style.visibility='visible';
  $('#space').style.opacity=$('#stars').style.opacity=0;
  $('#ground').style.transform=$('#steam').style.transform=$('#bgFar').style.transform='';
  drawSceneRocket();
  const vb=rocketBox(holder.firstElementChild),coreW=(ART[r.id]?ART[r.id].core:26*r.w)*BS.scale;
  BS.pad=setupPad(r,vb.height*BS.scale,vb.width*BS.scale,coreW,BS.mood);
  rw.style.bottom=BS.pad.foot+'px';rw.style.left=rw.style.transform='';
  const bs=$('#bscene');
  if(!keep){bs.classList.add('intro');setTimeout(()=>bs.classList.remove('intro'),1500);}
  renderBuild();
  // Rakete mit Crew: den Boden-Shader der Landung jetzt in Ruhe übersetzen (nicht erst mitten im Flug; Bilder lädt erst crewHome)
  if(r.crew&&!LDGL.tried)(window.requestIdleCallback||setTimeout)(()=>landGL());
}
function closeModal(){cur=null;$('#modal').classList.add('hidden');coinRelease();
  if(inScene()){const L=$('#launch');L.classList.add('hidden');L.classList.remove('build');}
  render();}
// Rakete in der Szene: so groß wie beim Start (gleiche Rechnung wie in playLaunch), damit der Start nahtlos anschließt.
// k: gerade gebautes Teil, blitzt kurz auf
function drawSceneRocket(k){
  const r=cur,set=builtSet(r),key=[...set].sort().join();
  if(key===BS.bk)return;BS.bk=key;
  const holder=$('#rocketSvg');holder.innerHTML=drawRocket(r,set);
  const el=holder.firstElementChild,vb=rocketBox(el);
  BS.scale=Math.min(innerHeight*.5/vb.height,2.4);
  el.style.height=vb.height*BS.scale+'px';el.style.width=vb.width*BS.scale+'px';
  pixelizeAll(holder);
  const im=k&&(holder.querySelector(`img[src$="/${k}.png"]`)||holder.firstElementChild);
  if(im)im.animate([{filter:'brightness(2.4) drop-shadow(0 0 14px #fde047)'},{filter:'none'}],{duration:900,easing:'ease-out'});
}
// Wo die Linie eines Teils an der Rakete ankommt: rechte Kante, Mitte des Teils (Anteile 0..1 von Breite/Höhe des Bildes)
function partAnchors(r){
  const a=ART[r.id],out={};
  if(a){for(const k in a.parts){const p=a.parts[k];out[k]={x:p.x1/a.w,y:(p.y0+p.y1)/2/a.h};}return out;}
  const g=rocketGeom(r,'all'),v=g.vb;
  for(const k in g.anchors){const p=g.anchors[k];out[k]={x:(p.x-v.x)/v.w,y:(p.y-v.y)/v.h};}
  return out;
}
function renderBuild(k){
  const r=cur;if(!r||!inScene())return;
  drawSceneRocket(k);
  const set=builtSet(r),done=complete(r),cool=coolLeft(r),T=TIERS[r.tier];BS.ck=Math.ceil(cool/1000); // angezeigte Sekunden (Zeitgeber unten)
  const rest=r.parts.filter(p=>!set.has(p.k)).reduce((a,p)=>a+p.cost,0);
  $('#bscene').innerHTML=`<svg class="blines" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="bhud">
    <div class="bpanel binfo t${r.tier}">
      <span class="tag">${T.name}</span>
      <h2>${r.name}</h2>
      <div class="muted">${r.land} · erster Start ${r.year}</div>
      <div class="badges">
        ${r.crew?`<span>${ic('crew')}Mit Astronauten</span>`:''}
        ${r.reuse?`<span>${ic('reuse')}Landet wieder</span>`:''}
        <span>${ic('chance')}Klappt zu ${Math.round(r.chance*100)} %</span>
        <span>${ic('target')}Fliegt bis: ${r.dest} (${kmText(r.alt)})</span>
        <span>${ic('coin')}Je höher, desto mehr: bis zu ${fmt(r.reward)}</span>
      </div>
      <div class="small">${r.reuse?'Nach einem guten Start bleibt die Rakete stehen und kann wieder starten. Bei einem Fehlstart bleibt nur etwa die Hälfte der Teile heil.':'Diese Rakete muss nach jedem Start neu gebaut werden.'}
      ${r.tower?' Der Rettungsturm rettet bei einem Fehlstart die Crew – dann gibt es trotzdem ein bisschen Geld.':''}</div>
    </div>
    <div class="bact">
      <div class="row"><div class="bpanel moneyp">${ic('coin')}<span><small class="lbl">Geld</small><b>${fmt(S.money)}</b></span></div>
        <button class="iconbtn" onclick="closeModal()" aria-label="Zurück">${ic('close')}</button></div>
      ${done?(cool?`<div class="bpanel hint wait">${ic('clock')}<span>Wird für den nächsten Start vorbereitet. <b>Bereit in ${Math.ceil(cool/1000)} s</b></span></div>`
        :`<div class="launchp"><div class="rh"><span class="led"></span>Alles bereit zum Start</div>
          ${destHtml(r)}
          <button class="gobtn" onclick="launch(true)">${ic('flame')}Starten &amp; zuschauen</button>
          <button class="btn sec" onclick="launch(false)">${ic('ff')}Schnellstart</button></div>`)
        :`<div class="bpanel hint">${ic('wrench')}<span>Klick auf die Kästchen und bau alle Teile, dann kannst du starten! Es fehlen noch ${coins(rest)}.</span></div>`}
    </div>
  </div>
  ${r.parts.map((p,i)=>{const b=set.has(p.k),can=S.money>=p.cost;
    return `<button class="pbox ${b?'built':''} ${!b&&!can?'poor':''}" data-k="${p.k}" style="animation-delay:${.15+i*.08}s" ${b||!can?'disabled':''} onclick="buildPart('${p.k}')">
      <span class="pn">${p.n}</span><span class="pc">${b?ic('check')+'Gebaut':ic('coin')+fmt(p.cost)}</span></button>`;}).join('')}`;
  layoutBoxes();
}
// Kästchen rechts neben die Rakete, jedes möglichst auf Höhe seines Teils (ohne Überlappen), Linie zum Teil
function layoutBoxes(){
  const bs=$('#bscene'),rk=$('#rocketSvg').firstElementChild;if(!rk||!cur)return;
  const R=rk.getBoundingClientRect(),A=partAnchors(cur),top=bs.querySelector('.bhud').getBoundingClientRect().bottom+6,gap=8;
  const bx=[...bs.querySelectorAll('.pbox')].map(el=>{const a=A[el.dataset.k]||{x:1,y:.5};
    return {el,ax:R.left+a.x*R.width,ay:R.top+a.y*R.height,h:el.offsetHeight};}).sort((p,q)=>p.ay-q.ay);
  const W=Math.max(...bx.map(b=>b.el.offsetWidth)),x0=Math.max(R.right+24,Math.min(innerWidth-W-14,R.right+Math.max(50,(innerWidth-R.right-W)*.3)));
  let y=top;for(const b of bx){b.y=Math.max(b.ay-b.h/2,y);y=b.y+b.h+gap;}
  let lim=innerHeight-12;for(let i=bx.length-1;i>=0;i--){const b=bx[i];b.y=Math.min(b.y,lim-b.h);lim=b.y-gap;}
  bs.querySelector('.blines').innerHTML=bx.map(b=>{
    const cls=b.el.classList.contains('built')?'built':b.el.classList.contains('poor')?'poor':'',cy=b.y+b.h/2;
    b.el.style.left=x0+'px';b.el.style.top=b.y+'px';
    return `<path class="${cls}" d="M${b.ax} ${b.ay}H${b.ax+14}L${x0-14} ${cy}H${x0}"/><rect class="${cls}" x="${b.ax-4}" y="${b.ay-4}" width="8" height="8"/>`;
  }).join('');
}
addEventListener('resize',()=>{if(cur&&inScene()){clearTimeout(BS.rt);BS.rt=setTimeout(()=>{if(cur&&inScene())openBuild(cur,true);},150);}});
function buildPart(k){
  const r=cur,p=r.parts.find(x=>x.k===k);
  if(!p||S.money<p.cost)return;
  const set=builtSet(r);if(set.has(k))return;
  S.money-=p.cost;set.add(k);S.built[r.id]=[...set];save();
  sfx.pay();
  checkBroke();renderBuild(k);render();
  if(complete(r))toast(`${r.name} ist fertig gebaut!`,'check');
}

// ===================== Glücksbox =====================
function drawCard(box){
  const tier=TIERS.indexOf(pickWeighted(TIERS,t=>box.w[TIERS.indexOf(t)]));
  const pool=ROCKETS.filter(r=>r.tier===tier);
  const open=pool.filter(r=>!unlocked(r));
  // Meistens kommt eine Rakete, die man noch nicht hat – bevorzugt eine, von der man schon Karten hat
  const r=(open.length&&Math.random()<.8)?pickWeighted(open,x=>1+cardsOf(x)*1.5):pool[Math.floor(Math.random()*pool.length)];
  if(unlocked(r)){const d=TIERS[tier].dup;S.money+=d;return {r,dup:d};}
  S.cards[r.id]=cardsOf(r)+1;
  return {r,n:S.cards[r.id],unlock:S.cards[r.id]===CARDS_NEEDED};
}
// Box in der Box: in etwa 1 von 10 Boxen steckt statt einer Karte eine Bonus-Box (gratis).
// Meist gleich gut oder 1 Glück besser, ganz selten die 5-Glück-Box als Jackpot. Auch in einer Bonus-Box kann wieder eine stecken.
// Zum Testen (nur hier!) Math.random vorgeben: erster Wert < .1 → Bonus-Box, zweiter: < .04 Jackpot, < .45 ein Glück besser, sonst gleich.
// Pro Stufe wird innerBox einmal gefragt (z. B. .05,.5, .05,.3, .5 → zwei Bonus-Boxen).
function innerBox(b){
  if(Math.random()>=.1)return null;
  const v=Math.random(),i=BOXES.indexOf(b);
  return BOXES[v<.04?BOXES.length-1:Math.min(BOXES.length-1,i+(v<.45?1:0))];
}
// Geld in der Box: in etwa 1 von 6 Boxen steckt zusätzlich zu den Karten eine Geld-Karte.
// Meist 30–150 % vom Boxpreis, ganz selten (1 von 12) 2–3-mal so viel. Gibt 0 zurück, wenn kein Geld drin ist.
// Zum Testen boxMoney umhüllen (z. B. window.boxMoney=b=>b.price), sonst verbraucht die Animation die Zufallswerte.
function boxMoney(b){
  if(Math.random()>=1/6)return 0;
  const big=Math.random()<1/12,v=Math.random();
  return round10(b.price*(big?2+v:.3+v*1.2));
}
// Ablauf: 1 s wackeln, dann springt der Würfel auf (Deckel fliegt, Lichtblitz), danach kommen die Karten
const POP=1,CARD0=POP+.25;
function lbStageHtml(b){
  const bits=Array.from({length:10},(_,k)=>{const a=k/10*Math.PI*2+Math.random()*.4,d=120+Math.random()*90;
    return `<span class="lbBit" style="--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d)}px"></span>`;}).join('');
  return `<div class="lbStage" style="--lbc:${b.color}"><div class="lbRays"></div><div class="lbFlash"></div>
     <div class="lbCube l${b.luck}">${luckyBlock(b.color,b.luck)}</div>${bits}</div>`;
}
// Holo-Glanz (CSS .holo) für Episch und Legendär; Legendär mit zweitem Funkeln
const holoHtml=t=>t===3?'<i class="holo"><i></i></i>':t===2?'<i class="holo"></i>':'';
// Lichtfleck auf dem Holo-Glanz folgt Maus oder Finger (setzt nur --mx/--my, kein Neuaufbau der Karte)
function holoPointer(e){
  const c=e.target.closest&&e.target.closest('.card,.tile'),h=c&&c.querySelector(':scope>.holo');if(!h)return;
  if(e.type==='pointerout'){if(!c.contains(e.relatedTarget)){h.style.removeProperty('--mx');h.style.removeProperty('--my');}return;}
  const b=h.getBoundingClientRect();
  h.style.setProperty('--mx',((e.clientX-b.left)/b.width*100).toFixed(1)+'%');
  h.style.setProperty('--my',((e.clientY-b.top)/b.height*100).toFixed(1)+'%');
}
for(const t of ['pointermove','pointerdown','pointerout'])addEventListener(t,holoPointer,{passive:true});
// Karte: Seltenheit, Bild, Name, Land · Jahr, darunter info (HTML); Episch und Legendär bekommen den Holo-Glanz
function cardBase(r,info,delay=0){
  return `
     <div class="card t${r.tier}" style="animation-delay:${delay}s">
       <div class="tier">${TIERS[r.tier].name}</div>
       <div class="cimg">${drawRocket(r,'all')}</div>
       <div class="cname">${r.name}</div><div class="cmeta">${r.land} · ${r.year}</div>
       <div class="cinfo">${info}</div>${holoHtml(r.tier)}
     </div>`;
}
const cardHtml=(c,delay)=>cardBase(c.r,c.dup?`Doppelt: <b>+${fmt(c.dup)}</b>${ic('coin','coin')}`
  :c.unlock?`<b class="unl">${ic('star')}Freigeschaltet!</b>`:`${ic('cards')}${c.n}/${CARDS_NEEDED} Karten`,delay);
// Geld-Karte (boxMoney): goldener Münzstapel, das Geld fliegt danach als Münzregen nach oben
const moneyHtml=(n,b,delay)=>`
     <div class="card moneyCard" style="animation-delay:${delay}s">
       <div class="tier">${n>=b.price*2?'Ganz viel Geld!':'Geld!'}</div>
       <div class="cimg"><div class="mStack">${ic('coin','m1')}${ic('coin','m2')}${ic('coin','m3')}</div></div>
       <div class="cname">Münzen</div><div class="cmeta">Für dein Konto</div>
       <div class="cinfo"><b>+${fmt(n)}</b>${ic('coin','coin')}</div><i class="mShine"></i>
     </div>`;
// Anzahl Karten einer Stufe vor der Bonus-Box (Raketenkarten + evtl. Geld-Karte)
const lvCount=L=>L.res.length+(L.money?1:0);
// Bonus-Boxen gehen schneller auf (kürzer wackeln, Karten schneller), damit eine Kette nicht zu lange dauert
const MAX_DEPTH=4,POP2=.5,CARD2=POP2+.2,STEP2=.3,WAIT2=.7;
// Eine Stufe der Kette: Überschrift, Karten, evtl. die nächste Box als Karte und der Platz, an dem sie aufgeht
function levelHtml(lv,k,c0,step){
  const L=lv[k],nx=lv[k+1];
  return `
   <div class="dhead lbHead"><span class="kick ${L.jack?'jack':''}">${k?(L.jack?'Jackpot!':'Bonus-Box'):'Neue Karten'}</span>
     <h2>${k?'Bonus-Box':'Glücksbox'} geöffnet!</h2>${stars(L.box.luck)}</div>
   <div class="cards">${L.res.map((c,j)=>cardHtml(c,c0+j*step)).join('')}${L.money?moneyHtml(L.money,L.box,c0+L.res.length*step):''}${nx?`
     <div class="card boxCard" style="animation-delay:${c0+lvCount(L)*step}s;--tc:${nx.box.color};--lbc:${nx.box.color}">
       <div class="tier">${nx.jack?'Jackpot!':'Noch eine Box!'}</div>
       <div class="cimg"><div class="lb l${nx.box.luck}">${luckyBlock(nx.box.color,nx.box.luck)}</div></div>
       <div class="cname">Glücksbox</div>${stars(nx.box.luck)}
       <div class="cinfo">Geht gleich auf …</div>
     </div>`:''}</div>
   ${nx?'<div class="lbInner"></div>':''}`;
}
// Großer Knall, wenn eine Bonus-Box aufgeht: Lichtstrahlen, Blitz und Konfetti über allem, Dialog ruckelt kurz
function lbBurst(el,color,jack){
  if(!el)return;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const cols=[color,'#facc15','#f472b6','#38bdf8','#4ade80','#fff'],n=jack?48:26;
  const bits=Array.from({length:n},(_,k)=>{const a=Math.random()*Math.PI*2,d=(jack?200:140)+Math.random()*(jack?280:160);
    return `<span class="lbConf c${k%3}" style="--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d)}px;--rot:${Math.round((Math.random()-.5)*720)}deg;color:${cols[k%cols.length]};animation-delay:${(Math.random()*.15).toFixed(2)}s"></span>`;}).join('');
  const d=document.createElement('div');
  d.className='lbBurst'+(jack?' jack':'');d.style.cssText=`--lbc:${color};--x:${Math.round(x)}px;--y:${Math.round(y)}px`;
  d.innerHTML=`<div class="lbRays"></div><div class="lbFlash"></div>${bits}`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2200); // an body: #modal hat backdrop-filter und wäre sonst Bezugsrahmen für position:fixed
  const m=$('#modalBody');m.classList.remove('lbPunch','lbBig');void m.offsetWidth;m.classList.add('lbPunch');if(jack)m.classList.add('lbBig');
  setTimeout(()=>m.classList.remove('lbPunch','lbBig'),900);
}
let boxRun=0;
function buyBox(i){
  const b=BOXES[i];if(S.money<b.price)return;
  S.money-=b.price;
  // Kette: Box, Bonus-Box darin, Bonus-Box in der Bonus-Box … (höchstens MAX_DEPTH Bonus-Boxen).
  // Alle Karten werden jetzt gezogen und zusammen gespeichert; bezahlt wird nur die erste Box.
  const chain=[b];
  while(chain.length<=MAX_DEPTH){const nb=innerBox(chain[chain.length-1]);if(!nb)break;chain.push(nb);}
  const lv=chain.map((x,k)=>{const res=[];for(let j=0;j<x.cards-(k<chain.length-1?1:0);j++)res.push(drawCard(x));
    return {box:x,res,money:boxMoney(x),jack:k>0&&x.luck-chain[k-1].luck>1};});
  lv.forEach(L=>S.money+=L.money);
  coinRelease();coinHold(lv.reduce((a,L)=>a+L.money+L.res.reduce((s,c)=>s+(c.dup||0),0),0)); // Geld doppelter Karten und Geld-Karten kommt als Münzregen
  save();render();
  const run=++boxRun;
  $('#modalBody').classList.remove('narrow');
  $('#modalBody').innerHTML=`${lbStageHtml(b)}${levelHtml(lv,0,CARD0,.45)}
   <div class="center"><button class="btn primary okbtn" ${lv.length>1?'disabled':''} onclick="afterBox()">Weiter${ic('arrow')}</button></div>`;
  cur=null;$('#modal').classList.remove('hidden');
  pixelizeAll($('#modalBody'));dupRain(lv[0],$('#modalBody'),CARD0,.45);
  setTimeout(()=>{if($('#modalBody .lbStage'))sfx.boxOpen();},POP*1000);
  lv[0].res.forEach((c,k)=>sfx.cardFlip(c.r.tier,CARD0+.15+k*.45));
  if(lv[0].money)sfx.cardFlip(2,CARD0+.15+lv[0].res.length*.45);
  if(lv.length<2)return;
  const t0=CARD0+lvCount(lv[0])*.45;
  sfx.cardFlip(2,t0+.15);
  // Die Bonus-Box geht kurz danach unter den Karten auf, dann evtl. die nächste …
  const openLevel=(k,t)=>setTimeout(()=>{
    const slot=document.querySelectorAll('#modalBody .lbInner')[k-1],card=document.querySelectorAll('#modalBody .boxCard')[k-1];
    if(run!==boxRun||!slot||!card||$('#modal').classList.contains('hidden'))return;
    const L=lv[k];
    card.style.animationDelay='0s';card.classList.add('jump');
    card.querySelector('.cinfo').innerHTML=ic('down')+'Ist aufgegangen!';
    slot.innerHTML=lbStageHtml(L.box)+levelHtml(lv,k,CARD2,STEP2);
    pixelizeAll(slot);dupRain(L,slot,CARD2,STEP2);
    slot.scrollIntoView({behavior:'smooth',block:'end'});
    setTimeout(()=>{if(run!==boxRun)return;sfx.boxOpen();card.classList.add('opened');lbBurst(slot.querySelector('.lbCube'),L.box.color,L.jack);},POP2*1000);
    L.res.forEach((c,j)=>sfx.cardFlip(c.r.tier,CARD2+.15+j*STEP2));
    if(L.money)sfx.cardFlip(2,CARD2+.15+L.res.length*STEP2);
    const tk=CARD2+lvCount(L)*STEP2;
    if(k<lv.length-1){sfx.cardFlip(2,tk+.15);openLevel(k+1,tk+WAIT2);}
    else setTimeout(()=>{const ok=$('#modalBody .okbtn');if(run===boxRun&&ok){ok.disabled=false;ok.scrollIntoView({behavior:'smooth',block:'nearest'});}},tk*1000);
  },t*1000);
  openLevel(1,t0+WAIT2);
}
function afterBox(){closeModal();if(!checkWin())checkBroke();}
// Klick auf den dunklen Hintergrund: beim Box-Dialog wie „Weiter“ (aber nicht, solange die Bonus-Box noch aufgeht)
function bgClose(){
  if(!$('#modalBody > .lbStage'))return closeModal();
  const ok=$('#modalBody .okbtn');if(ok&&ok.disabled)return;
  afterBox();
}

// ===================== Starten =====================
// Ziel wählen (8b1.8): im Start-Pult ein Ziel bis höchstens zum eigenen Ziel der Rakete (r.dest). DLAD = wählbare Ziele [Name, km],
// DRANK = Reihenfolge aller Ziele (gleicher Rang = gleich weit). Näher = weniger Geld (Anteil f nach der Höhe, logarithmisch), dafür sicherer.
// Das eigene Ziel (Standard) ist die Rakete selbst – Geld und Chance genau wie bisher. Die Wahl gilt je Rakete, solange das Spiel offen ist (DPICK, nicht gespeichert).
const DLAD=[['Kurz ins All',190],['Erdumlaufbahn',400],['Raumstation',420],['Geostationär',36000],['Mond',384400],['Mars',225000000]];
const DRANK={'Kurz ins All':0,'Weltall':1,'Erdumlaufbahn':1,'Raumstation':2,'Raumstation ISS':2,'Geostationär':3,'Mond':4,
  'Weltraumteleskop':5,'Tiefer Weltraum':5,'Sonne':6,'Mars':6,'Asteroid':7,'Pluto':8};
const DPICK={};
// Alle wählbaren Ziele, nah → weit: {dest, alt (km), f (Anteil am Geld), chance, reward}; das letzte ist das eigene Ziel
function destsOf(r){
  const rk=DRANK[r.dest]??99,L=Math.log10(1+r.alt);
  return [...DLAD.filter(([d,km])=>DRANK[d]<rk&&km<r.alt).map(([d,km])=>{const f=Math.max(.1,(Math.log10(1+km)/L)**1.5);
      return {dest:d,alt:km,f,chance:Math.max(r.chance,Math.min(.99,r.chance+(1-r.chance)*(1-f))),reward:round10(r.reward*f)};}),
    {dest:r.dest,alt:r.alt,f:1,chance:r.chance,reward:r.reward}];
}
const destPick=r=>{const D=destsOf(r);return D.find(d=>d.dest===DPICK[r.id])||D[D.length-1];};
// Die Rakete mit dem gewählten Ziel: eigenes Ziel = die Rakete selbst; sonst eine Ansicht (Object.create), die nur dest, alt, chance
// und reward ersetzt. Sie geht als res.r durch den ganzen Flug (resBook, playLaunch, Bericht, Aufträge), so zeigt alles das gewählte Ziel.
function destView(r){
  const d=destPick(r);if(d.f===1)return r;
  return Object.create(r,{dest:{value:d.dest},alt:{value:d.alt},chance:{value:d.chance},reward:{value:d.reward}});
}
function pickDest(d){if(!cur)return;DPICK[cur.id]=d;renderBuild();}
// Ziel-Auswahl im Start-Pult: oben das weiteste Ziel, je Zeile Geld (bis zu) und Chance; Zeichen, wenn ein Ziel einen Auftrag schafft
function destHtml(r){
  const D=destsOf(r),p=destPick(r),one=D.length<2,mis=new Set((S.missions||[]).filter(m=>m.t==='dest').map(m=>m.v));
  const tip=one?'':p.f===1?`<span class="dtip">${ic('coin')}<span>Am weitesten: <b>mehr Geld</b></span></span>`
    :`<span class="dtip safe">${ic('shield')}<span>Näher: <b>sicherer</b>, weniger Geld</span></span>`;
  return `<div class="dpick"><div class="dph"><span class="lbl">${one?'Ziel':'Ziel wählen'}</span>${tip}</div>
    ${D.slice().reverse().map(d=>{const on=d.dest===p.dest,M=MDEST[mDest(d)];
      return `<button class="drow${on?' on':''}" ${one?'disabled':`onclick="pickDest('${d.dest}')"`} aria-pressed="${on}" aria-label="${d.dest}: bis zu ${fmt(d.reward)} Geld, klappt zu ${Math.round(d.chance*100)} %">
        <span class="dn">${ic(M?M[1]:'target')}<span>${d.dest}</span>${mis.has(mDest(d))?`<i class="dm" title="Schafft einen Auftrag">${ic('target')}</i>`:''}</span>
        <span class="dc">${ic('coin')}${fmt(d.reward)}</span><span class="dp">${ic('chance')}${Math.round(d.chance*100)} %</span></button>`;}).join('')}</div>`;
}
function launch(watch){
  const r0=cur;if(!r0||!complete(r0)||coolLeft(r0))return;
  const r=destView(r0); // gewähltes Ziel (8b1.8)
  // b: Zufall für die Flughöhe; q: wie gut mitgespielt wurde (0–1, null = gar nicht), siehe resBook
  const res={r,dest:r.dest,success:Math.random()<r.chance,b:Math.random(),q:null,built0:(S.built[r.id]||[]).slice(),tower:!!r.tower};
  emgPlan(res);
  // Fehlstart (8b1.5): jedes Teil bleibt mit KEEP_CHANCE heil. Einmal pro Flug gewürfelt, damit resSettle nicht neu würfelt.
  // Hitzeschild/Fallschirm nicht geschafft: der Bericht sagt „die Kapsel ist kaputt“, also bleibt sie nie heil.
  res.keep=res.built0.filter(k=>Math.random()<(window.FORCE_KEEP??KEEP_CHANCE)&&!(k==='top'&&(res.emg==='heat'||res.emg==='chute')));
  if(res.emg)res.success=false; // wird erst im Notfall entschieden; bis dahin als Fehlstart gebucht (Neuladen rettet nichts)
  if(res.tap&&!watch)res.q=.5;   // Schnellstart: die Stufentrennung klappt mittelgut
  S.launches++;resBook(res,1);save();
  $('#modal').classList.add('hidden');
  if(watch){if(BS.r===r0)BS.r=r;playLaunch(res,()=>{if(BS.r===r)BS.r=r0;showResult(res);});} // BS.r: playLaunch erkennt die Szene (fromScene)
  else{const L=$('#launch');L.classList.add('hidden');L.classList.remove('build');if(res.emg)alarm(res);else showResult(res);}
}
// ===== Mitspielen: Notfälle und Stufentrennung tippen (hl0.14, hl0.17) =====
// Notfälle sind selten (etwa jeder 5. Start, nie mehr als einer pro Flug). Vor allem werden Fehlstarts zu Notfällen, die man retten kann:
// aus einem gewürfelten Fehlstart wird mit EMG_FAIL ein Notfall, dazu bei geglückten Starts so oft, dass es zusammen etwa EMG_RATE sind.
// Das Stufentrennung-Tippen ist kein Notfall, sondern ein Spaß-Moment: in jedem 2. Flug mit Stufen (TAP_RATE), nie zusammen mit einem Notfall.
// Test: window.FORCE_EMERGENCY bzw. ?notfall= in der Adresse: ein Schlüssel aus EMG (z. B. 'engine', 'leak', 'chute'; passt er nicht
// zur Rakete, gibt es keinen Notfall), 'stage' (Stufentrennung tippen), 'none' (nichts)
const EMG_RATE=.2,EMG_FAIL=.6,TAP_RATE=.5,ALARM_S=8;
// Notfall-Katalog (hl0.16): je Typ die Phase (ph: 'up' Aufstieg vor der ersten Trennung, 'sep' an der ersten Stufentrennung,
// 'orbit' im All nach dem Brennschluss, 'sat' beim Aussetzen des Satelliten, 'home' Rückkehr der Kapsel), für welche Raketen (ok),
// Alarm-Satz beim Schnellstart (al), rote Meldung im Flug (say), Name im Flugbericht (n), bei späten Phasen Text fürs Scheitern (bad).
// Neuer Typ: hier eintragen, Ablauf in playLaunch (EMS.<typ>: Anzeige, em.step, em.fin; späte Phasen brauchen einen Haken).
const capHome=r=>{const A=ART[r.id];return !!(r.crew&&A&&A.parts.top&&!r.top);}; // Kapsel kommt zurück (crewHome → home)
const satOut=r=>{const A=ART[r.id],T=A&&A.parts.top;return !!(!r.crew&&T&&!r.top&&Math.abs((T.x0+T.x1)/2-A.w/2)<=A.w*.06);}; // Satellit mit Solarflügeln (deploy)
const EMG={
  engine:{ph:'up',ok:()=>true,al:'ist ein Triebwerk ausgefallen',say:'Triebwerk ausgefallen!',n:'Triebwerk ausgefallen'},
  leak:{ph:'up',ok:()=>true,al:'ist ein Treibstoffleck',say:'Treibstoffleck!',n:'Treibstoffleck'},
  fire:{ph:'up',ok:r=>!!r.crew,al:'brennt es in der Kabine',say:'Feuer an Bord!',n:'Feuer an Bord'},
  sep:{ph:'sep',ok:r=>hasTapSep(r),al:'klemmt die Stufe',say:'Die Stufe trennt sich nicht!',n:'Stufe klemmt'},
  air:{ph:'orbit',ok:r=>!!r.crew,al:'ist ein Luftleck in der Kabine',say:'Luftleck in der Kabine!',n:'Luftleck',
    bad:'Die Crew musste früher nach Hause fliegen. Die Mission ist gescheitert.'},
  panel:{ph:'sat',ok:r=>satOut(r),al:'klemmt ein Solarpanel',say:'Ein Solarpanel klemmt!',n:'Solarpanel klemmt',
    bad:'Der Satellit hat zu wenig Strom. Die Mission ist gescheitert.'},
  heat:{ph:'home',ok:r=>capHome(r),al:'ist der Hitzeschild kaputt',say:'Der Hitzeschild ist beschädigt!',n:'Hitzeschild beschädigt',
    bad:'Die Kapsel ist zu heiß geworden und kaputt. Die Crew ist aber heil.'},
  chute:{ph:'home',ok:r=>capHome(r),al:'geht der Fallschirm nicht auf',say:'Der Fallschirm geht nicht auf!',n:'Fallschirm klemmt',
    bad:'Harte Landung! Die Kapsel ist kaputt. Die Crew ist aber heil.'},
};
const EMG_TYPES=Object.keys(EMG);
const hasTapSep=r=>{const A=ART[r.id];return !!(A&&r.parts.some(p=>(p.k==='s2'||p.k==='s3')&&A.parts[p.k])&&r.top!=='Raumschiff');};
function emgPlan(res){
  const r=res.r,c=r.chance,f=window.FORCE_EMERGENCY||new URLSearchParams(location.search).get('notfall');
  res.emg=null;res.tap=false;
  if(f){if(EMG[f]){if(EMG[f].ok(r))res.emg=f;else console.warn('Notfall',f,'passt nicht zu',r.id);}else if(f==='stage')res.tap=hasTapSep(r);return;}
  const pE=res.success?Math.max(0,(EMG_RATE-(1-c)*EMG_FAIL)/c):EMG_FAIL,T=EMG_TYPES.filter(k=>EMG[k].ok(r));
  if(Math.random()<pE)res.emg=T[Math.random()*T.length|0];
  else res.tap=res.success&&hasTapSep(r)&&Math.random()<TAP_RATE;
}
// Ergebnis buchen (sg=1) bzw. zurücknehmen (sg=-1). Höhe: ohne Mitspielen 60–100 % Zufall, mit Mitspielen halb Zufall, halb Können (q);
// ein geretteter Notfall bringt 10 % Rettungs-Bonus
function resBook(res,sg){
  const r=res.r;
  if(sg<0){S.money-=res.gain;if(res.success)S.ok--;delete S.cool[r.id];S.built[r.id]=res.built0.slice();return;}
  res.frac=res.q==null?.6+.4*res.b:.6+.2*res.b+.2*res.q;
  res.reached=res.success?r.alt*res.frac:0;
  res.bonus=res.success&&res.emg?round10(r.reward*.1):0;
  res.gain=res.success?round10(r.reward*res.frac)+res.bonus:(r.tower?round10(r.reward*.2):0);
  S.money+=res.gain;if(res.success)S.ok++;
  if(res.success&&r.reuse)S.cool[r.id]=Date.now()+COOLDOWN[r.tier]*1000;
  else S.built[r.id]=res.success?[]:res.keep.slice(); // Fehlstart: die heilen Teile bleiben an der Rakete
}
// Fehlstart (8b1.5): Anteil der Teile, die heil bleiben. Test: window.FORCE_KEEP (0 = keins, 1 = alle)
const KEEP_CHANCE=.5;
// Teile-Check im Flugbericht nach Fehlstart oder gescheiterter Mission: welche Teile heil sind (res.keep)
function keepHtml(res){
  const k=new Set(res.keep),ps=res.r.parts.filter(p=>res.built0.includes(p.k)),n=ps.filter(p=>k.has(p.k)).length;
  return `<div class="pcheck"><span class="kick">Teile-Check</span><ul>${ps.map(p=>{const ok=k.has(p.k);
      return `<li class="${ok?'ok':'ko'}">${ic(ok?'check':'close')}<span>${p.n}</span><small>${ok?'heil':'kaputt'}</small></li>`;}).join('')}</ul></div>
    <p class="note">${n===ps.length?'Alle Teile sind heil geblieben! Die Rakete kann gleich wieder starten.'
      :n?`${n} von ${ps.length} Teilen sind heil geblieben. Nur die kaputten musst du neu bauen.`:'Kein Teil ist heil geblieben. Du musst die Rakete neu bauen.'}</p>`;
}
// nach dem Mitspielen neu buchen: ok = geschafft, q = wie gut (null = unverändert)
function resSettle(res,ok,q=res.q){resBook(res,-1);res.success=ok;res.q=q;resBook(res,1);save();}
// Schnellstart mit Notfall: Die Rakete fliegt im Hintergrund, nach kurzer Zeit blinkt oben der Alarm-Knopf. Drücken = in die Flugansicht
// springen und selbst steuern (playLaunch mit jump); nach ALARM_S Sekunden versucht es der Autopilot mit halber Chance.
// Bis der Alarm entschieden ist, ist alles andere gesperrt (#alarm deckt ab, der Rest ist inert): kein zweiter Start, keine Box,
// kein Bauen an der fliegenden Rakete – der Alarm kann also nie in einen anderen Flug oder eine Box platzen.
function alarm(res){
  const a=$('#alarm'),r=res.r,bg=[...document.body.children].filter(e=>e!==a&&e.id!=='sndBtn');let tm=0;
  cur=null;render();bg.forEach(e=>e.inert=true);
  a.innerHTML=`<div class="alarmwait">${ic('rocket')}<span>Die <b>${r.name}</b> fliegt …</span></div>`;a.classList.remove('hidden');
  const end=()=>{clearTimeout(tm);a.classList.add('hidden');a.innerHTML='';bg.forEach(e=>e.inert=false);};
  tm=setTimeout(()=>{
    a.innerHTML=`<button class="alarmbtn"><span class="ah">${ic('warn')}Alarm! Notfall!${ic('warn')}</span>
      <span class="as">Bei der ${r.name} ${EMG[res.emg].al}. Schnell drücken und selbst retten!</span><span class="at"><i></i></span></button>`;
    sfx.beep();
    const b=a.querySelector('button');b.focus();
    b.querySelector('.at i').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:ALARM_S*1000,fill:'forwards'});
    b.onclick=()=>{end();playLaunch(res,()=>showResult(res),true);};
    tm=setTimeout(()=>{end();res.auto=true;resSettle(res,Math.random()<.5);showResult(res);},ALARM_S*1000);
  },1300);
}
function showResult(res){
  const r=res.r;cur=null;
  let html;
  const md=mCheck(res),mGain=md.reduce((a,d)=>a+d.m.g,0); // Aufträge: erst hier, mit dem endgültigen Ergebnis (nach resSettle)
  const mHtml=md.length?`<div class="mdone">${md.map(d=>mCard(d.m,`<span class="kick">Auftrag geschafft</span>`,
    d.n?`<small>Neuer Auftrag: ${mTxt(d.n)}</small>`:'','+')).join('')}</div>`:'';
  const gain=`<div class="gain">${ic('coin')}<b>+${fmt(res.gain)}</b></div>`;
  // Mitspielen (hl0.14): Notfall gerettet / nicht geschafft, Autopilot, Stufentrennung getippt
  const E=res.emg&&EMG[res.emg],play=E?`<p>${ic(res.success?'check':'warn')} Notfall <b>${E.n}</b>: ${res.auto?(res.success?'Der Autopilot hat ihn gemeistert.':'Der Autopilot hat ihn nicht geschafft.')
      :res.success?`gemeistert! Rettungs-Bonus: ${coins(res.bonus)}`:'Diesmal hast du ihn nicht geschafft.'}</p>`
    :res.tapWord?`<p>${ic('down')} Stufentrennung: <b>${res.tapWord}</b></p>`:'';
  if(res.success)html=`<div class="resic">${ic(r.crew?'crew':'sat')}</div><span class="kick">Flugbericht</span><h2>Start geglückt!</h2>
    <p>Die ${r.name} ist <b>${kmText(res.reached)}</b> weit geflogen. Ziel: ${r.dest}.</p>${play}
    <div class="meter"><div class="mtrack"><i style="width:${res.frac*100}%"></i></div>
      <div class="mlab"><span>${Math.round(res.frac*100)} % von ganz oben</span><span>Je höher, desto mehr Geld</span></div></div>
    ${gain}${mHtml}<p class="note">${r.reuse?'Die Rakete ist wieder gelandet und kann bald nochmal starten.':'Für den nächsten Start musst du sie neu bauen.'}</p>`;
  else if(E&&E.bad)html=`<div class="resic bad">${ic('warn')}</div><span class="kick">Flugbericht</span><h2>Mission gescheitert</h2><p>${E.bad}</p>${play}
    ${res.gain?gain:''}${keepHtml(res)}`; // später Notfall (hl0.16): die Rakete ist nicht explodiert
  else html=`<div class="resic bad">${ic('burst')}</div><span class="kick">Flugbericht</span><h2>Fehlstart!</h2><p>Die ${r.name} ist explodiert.</p>${play}
    ${res.tower?`<p>${ic('chute')} Aber der Rettungsturm hat die Crew gerettet!</p>${gain}`:''}
    ${keepHtml(res)}`;
  $('#modalBody').classList.add('narrow');
  $('#modalBody').innerHTML=`<div class="center res">${html}<div class="dfoot">
    <button class="btn primary okbtn" onclick="closeModal();checkBroke()">OK</button>
    <button class="btn sec" onclick="openBuild(byId('${r.id}'),false,true)">${ic('rocket')}Zur Rakete</button></div></div>`;
  coinRain(res.gain,()=>$('#modalBody .gain .ic'),450);
  coinRain(mGain,()=>$('#modalBody .mdone .mg .ic'),1500);
  $('#modal').classList.remove('hidden');render();
  if((res.gain||mGain)&&calmMotion())sfx.coin(); // sonst klingt es bei der letzten Münze
}

// ===================== Aufträge (8b1.3) =====================
// Immer 3 offene Aufträge mit Belohnung in S.missions (im Spielstand). Auftrag {t: Art (MKIND), v: Wert, g: Belohnung, p: Fortschritt (nur 'row')}.
// Nur Aufträge, die man schaffen kann: leicht = eine eigene Rakete passt; schwerer = passt erst zu einer Rakete, die man gerade sammelt
// oder aus derselben Stufe noch bekommen kann (mehr Geld). Immer mindestens ein leichter, wenn möglich auch ein schwerer.
// Belohnung nach den Baukosten der günstigsten passenden Rakete (leicht 50 %, schwer 75 %) – ein Extra, etwa ein Viertel bis ein Drittel
// eines normalen Flug-Gewinns. Geschafft wird nur mit einem geglückten Flug, geprüft einmal in showResult (nach dem Notfall-Ergebnis);
// mehrere Aufträge auf einmal gehen. Ein geschaffter Auftrag wird an derselben Stelle durch einen neuen ersetzt.
// Alte Spielstände ohne Feld bekommen beim nächsten render() Aufträge; neues Spiel (newRound, Reset) = neue Aufträge (die Raketen sind weg).
// Test: window.FORCE_MISSION bzw. ?auftrag= in der Adresse (1–3, sonst 1): dieser Auftrag gilt beim nächsten geglückten Flug als geschafft
const M_N=3,M_ROW=3;
const MDEST={'Kurz ins All':['Flieg kurz ins All','rocket'],'Erdumlaufbahn':['Flieg einmal um die Erde','globe'],'Mond':['Bring eine Rakete zum Mond','moon'],
  'Raumstation':['Flieg zu einer Raumstation','sat'],'Mars':['Bring eine Rakete zum Mars','planet'],'Asteroid':['Flieg zu einem Asteroiden','planet'],
  'Geostationär':['Bring einen Satelliten ganz hoch – 36.000 km','sat'],'Weltraumteleskop':['Bring ein Weltraum-Teleskop ins All','sat'],
  'Pluto':['Flieg bis zum Pluto','planet'],'Tiefer Weltraum':['Flieg in den tiefen Weltraum','star'],'Sonne':['Flieg zur Sonne','sun'],'Weltall':['Flieg ins Weltall','rocket']};
const MLAND={USA:'den USA',Sowjetunion:'der Sowjetunion',Ukraine:'der Ukraine'};
const mDest=r=>r.dest.startsWith('Raumstation')?'Raumstation':r.dest;
const MKIND={
  dest:{vals:r=>[mDest(r)],fit:(r,v)=>destsOf(r).some(d=>mDest(d)===v),txt:v=>MDEST[v][0],ic:v=>MDEST[v][1]},
  land:{vals:r=>[r.land],fit:(r,v)=>r.land===v,txt:v=>`Starte eine Rakete aus ${MLAND[v]||v}`,ic:()=>'flag'},
  crew:{vals:r=>r.crew?[1]:[],fit:r=>!!r.crew,txt:()=>'Flieg eine Rakete mit Astronauten',ic:()=>'crew'},
  reuse:{vals:r=>r.reuse?[1]:[],fit:r=>!!r.reuse,txt:()=>'Lande eine Rakete wieder auf der Erde',ic:()=>'reuse'},
  tier:{vals:r=>r.tier?[r.tier]:[],fit:(r,v)=>r.tier===v,txt:v=>`Starte eine ${['','seltene','epische','legendäre'][v]} Rakete`,ic:()=>'star'},
  side:{vals:r=>r.side?[1]:[],fit:r=>!!r.side,txt:()=>'Starte eine Rakete mit Seitenboostern',ic:()=>'flame'},
  st3:{vals:r=>r.stages>=3?[1]:[],fit:r=>r.stages>=3,txt:()=>'Starte eine Rakete mit 3 Stufen',ic:()=>'rocket'},
  row:{vals:()=>[M_ROW],fit:()=>true,txt:v=>`Schaff ${v} Starts hintereinander ohne Fehlstart`,ic:()=>'check'},
};
const mTxt=m=>MKIND[m.t].txt(m.v);
const mOwn=m=>ROCKETS.filter(r=>unlocked(r)&&MKIND[m.t].fit(r,m.v));
const mEasy=m=>m.t==='row'||mOwn(m).length>0;
const r50=n=>Math.max(100,Math.round(n/50)*50);
// Alle möglichen Aufträge gerade jetzt, je mit e (leicht) und g (Belohnung)
function mCands(){
  const own=ROCKETS.filter(unlocked),top=Math.max(-1,...own.map(r=>r.tier));
  const near=ROCKETS.filter(r=>!unlocked(r)&&(cardsOf(r)>0||r.tier<=top)),out=[];
  if(!own.length)return out;
  for(const t in MKIND){
    if(t==='row'){out.push({t,v:M_ROW,e:true,g:r50(own.reduce((a,r)=>a+r.cost,0)/own.length*.75)});continue;}
    const K=MKIND[t],vs=new Set([...own,...near].flatMap(K.vals));
    for(const v of vs){
      const fo=own.filter(r=>K.fit(r,v)),fn=near.filter(r=>K.fit(r,v)),e=fo.length>0;
      out.push({t,v,e,g:r50(Math.min(...(e?fo:fn).map(r=>r.cost))*(e?.5:.75))});
    }
  }
  return out;
}
// Einen neuen Auftrag aussuchen: have = die anderen offenen, not = gerade geschaffte (nicht gleich nochmal)
function mPick(have,not=[]){
  const same=(a,b)=>a.t===b.t&&a.v===b.v;
  const cs=mCands().filter(c=>![...have,...not].some(m=>same(m,c)));
  let pool=cs.filter(c=>!have.some(m=>m.t===c.t));if(!pool.length)pool=cs;
  const ne=have.filter(mEasy).length,want=!ne?true:ne===have.length?false:null;
  const p2=pool.filter(c=>want==null||c.e===want);if(p2.length)pool=p2;
  if(!pool.length)return null;
  const ts=[...new Set(pool.map(c=>c.t))],t=ts[Math.random()*ts.length|0],pt=pool.filter(c=>c.t===t); // erst die Art, dann den Wert
  const c=pt[Math.random()*pt.length|0];return {t:c.t,v:c.v,g:c.g,p:0};
}
// Auf 3 Aufträge auffüllen (erst wenn man eine Rakete hat, also nach dem Startgeschenk)
function mFill(){
  if(!ROCKETS.some(unlocked))return;
  const n0=JSON.stringify(S.missions||null);
  S.missions=(S.missions||[]).filter(m=>m&&MKIND[m.t]&&(m.t!=='dest'||MDEST[m.v]));
  while(S.missions.length<M_N){const m=mPick(S.missions);if(!m)break;S.missions.push(m);}
  if(JSON.stringify(S.missions)!==n0)save();
}
// Nach dem Flug (einmal pro Flug): Serie zählen, geschaffte Aufträge bezahlen und ersetzen. Gibt [{m: geschafft, n: neu}] zurück.
function mCheck(res){
  if(res.mDone)return res.mDone;
  const done=res.mDone=[];if(!S.missions)return done;
  const f=window.FORCE_MISSION||new URLSearchParams(location.search).get('auftrag'),fi=f?Math.max(1,Math.min(M_N,parseInt(f)||1))-1:-1;
  const keep=S.missions.map((m,i)=>{
    if(m.t==='row')m.p=res.success?(m.p||0)+1:0;
    const ok=res.success&&(i===fi||(m.t==='row'?m.p>=m.v:m.t==='dest'?mDest(res.r)===m.v:MKIND[m.t].fit(res.r,m.v))); // Ziel: nur das geflogene (8b1.8)
    if(ok)done.push({m,i});return ok?null:m;});
  done.forEach(d=>{d.n=mPick(keep.filter(Boolean),done.map(x=>x.m));keep[d.i]=d.n;S.money+=d.m.g;});
  S.missions=keep.filter(Boolean);save();
  return done;
}
// Ein Auftrag als Kasten; head = Zeile über dem Text, sub = Zeile darunter, pre = vor dem Betrag ('+' im Flugbericht)
function mCard(m,head,sub,pre=''){
  return `<div class="mis${mEasy(m)||pre?'':' hard'}"><div class="mic">${ic(MKIND[m.t].ic(m.v))}</div>
    <div class="mt">${head}<b>${mTxt(m)}</b>${sub}</div><div class="mg">${ic('coin')}${pre}${fmt(m.g)}</div></div>`;
}
// Kasten mit den offenen Aufträgen oben im Hangar
function mPanel(){
  const M=S.missions||[];if(!M.length)return '';
  return `<div class="mpanel"><div class="mhead">${ic('target')}<h3>Aufträge</h3><p>Schaff einen Auftrag mit einem Start – dann gibt es extra Geld!</p></div>
    <div class="mlist">${M.map(m=>{const o=mOwn(m);
      const sub=m.t==='row'?`<small><span class="mpips">${Array.from({length:m.v},(_,k)=>`<i class="${k<(m.p||0)?'on':''}"></i>`).join('')}</span>${m.p||0} von ${m.v} geschafft</small>`
        :o.length?`<small>${ic('rocket')}Passt zu: ${o.slice(0,2).map(r=>r.name).join(', ')}${o.length>2?' …':''}</small>`
        :`<small>${ic('lock')}Dafür brauchst du noch eine neue Rakete</small>`;
      return mCard(m,'',sub);}).join('')}</div></div>`;
}
// Zeichen an einer Rakete im Hangar, wenn sie zu einem Auftrag passt (Serie zählt nicht, die passt zu allen)
const mTag=r=>(unlocked(r)||cardsOf(r))&&(S.missions||[]).some(m=>m.t!=='row'&&MKIND[m.t].fit(r,m.v))
  ?`<span class="mtag" title="Passt zu einem Auftrag">${ic('target')}</span>`:'';

// ===================== Münzregen =====================
// Gewonnenes Geld fliegt als Münzen von seiner Anzeige (Flugbericht, doppelte Karte) im Bogen zur Geldanzeige oben,
// die dabei hochzählt. Blockiert nichts: Knöpfe bleiben bedienbar; ist die Quelle weg oder geht die Startszene auf,
// wird sofort alles gutgeschrieben. MR.pend = Geld, das schon in S.money steckt, aber oben noch nicht angekommen ist;
// MR.held = davon reserviert für Münzen, die erst später losfliegen (Karten aus Bonus-Boxen).
// Die Geldanzeige wird solange als Kopie (.moneyLift) über den abgedunkelten Hintergrund gehoben.
const MR={pend:0,held:0,disp:null,raf:0,last:0,gen:0,hg:0,coins:new Set(),lift:null};
const calmMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
// Kaufknöpfe der Glücksboxen richten sich nach dem oben angezeigten Geld, nicht nach S.money
function mrText(){const m=Math.round(MR.disp),s=fmt(m);$('#money').textContent=s;if(MR.lift)MR.lift.querySelector('b').textContent=s;
  document.querySelectorAll('#boxesView .buy').forEach((e,i)=>e.disabled=m<BOXES[i].price);}
function showMoney(){if(!MR.raf)MR.disp=S.money-MR.pend;mrText();}
function mrRun(){if(MR.raf)return;if(MR.disp==null)MR.disp=S.money-MR.pend;MR.last=performance.now();MR.raf=requestAnimationFrame(mrFrame);}
function mrFrame(now){
  const dt=Math.min(.1,(now-MR.last)/1000);MR.last=now;
  if(!$('#launch').classList.contains('hidden'))return coinStop();
  const t=S.money-MR.pend;
  MR.disp=t<MR.disp?t:Math.min(t,MR.disp+Math.max((t-MR.disp)*Math.min(1,dt*6),dt*60)); // zählt hoch, nie runter
  mrText();
  if(MR.pend||MR.coins.size||MR.disp!==t){MR.raf=requestAnimationFrame(mrFrame);return;}
  MR.raf=0;mrLiftOff();
}
// Geld für spätere Münzen schon zurückhalten (oben noch nicht anzeigen)
function coinHold(amt){if(!amt||calmMotion())return;MR.held+=amt;MR.pend+=amt;mrRun();}
// Zurückgehaltenes Geld, das nicht mehr losfliegt (Fenster zu), gleich gutschreiben
function coinRelease(){MR.pend-=MR.held;MR.held=0;MR.hg++;}
function coinStop(){MR.gen++;cancelAnimationFrame(MR.raf);MR.raf=0;MR.coins.forEach(a=>{a.cancel();a.effect.target.remove();});MR.coins.clear();
  MR.pend=MR.held=0;MR.hg++;showMoney();mrLiftOff();}
function mrLift(){
  if(MR.lift){MR.lift.classList.remove('out');return;}
  const s=$('.stat.money'),r=s.getBoundingClientRect(),d=s.cloneNode(true);
  d.querySelector('b').removeAttribute('id');d.classList.add('moneyLift');
  d.style.cssText=`left:${r.left}px;top:${r.top}px;min-width:${r.width}px;height:${r.height}px`;
  document.body.appendChild(d);MR.lift=d;mrText(); // an body: #modal hat backdrop-filter (s. lbBurst)
}
function mrLiftOff(){const d=MR.lift;if(!d)return;MR.lift=null;d.classList.add('out');setTimeout(()=>d.remove(),400);}
// amt Geld fliegt als 8–30 Münzen von getEl() (Funktion, wird erst nach delay ms gefragt) zur Geldanzeige.
// held: Geld wurde vorher mit coinHold zurückgehalten.
function coinRain(amt,getEl,delay=0,held=false){
  if(!amt||calmMotion())return;
  if(!held)MR.pend+=amt;
  mrRun();const gen=MR.gen,hg=MR.hg;
  setTimeout(()=>{
    if(gen!==MR.gen)return;
    if(held){if(hg!==MR.hg)return;MR.held-=amt;}
    const el=getEl(),tg=$('.stat.money .ic');
    if(!el||!el.getClientRects().length||!$('#launch').classList.contains('hidden')){MR.pend-=amt;return;}
    mrLift();
    const a=el.getBoundingClientRect(),b=tg.getBoundingClientRect();
    const x0=a.left+a.width/2,y0=a.top+a.height/2,x3=b.left+b.width/2,y3=b.top+b.height/2;
    const n=Math.max(8,Math.min(30,Math.round(Math.log10(amt)*6))),gap=Math.min(70,1000/n);
    let rest=amt;
    for(let k=0;k<n;k++){
      const v=k<n-1?Math.floor(amt/n):rest;rest-=v;
      // Bogen (Bézier): erst aus der Anzeige herausspringen, dann von unten in die Geldanzeige
      const sx=x0+(Math.random()-.5)*36,sy=y0+(Math.random()-.5)*20,side=Math.random()-.5;
      const p1x=sx+side*340,p1y=sy-90-Math.random()*120,p2x=x3+(Math.random()-.5)*140,p2y=y3+150+Math.random()*80;
      const spin=1.5+Math.random()*2,frames=[];
      for(let i=0;i<=16;i++){const t=i/16,u=1-t;
        const x=u*u*u*sx+3*u*u*t*p1x+3*u*t*t*p2x+t*t*t*x3,y=u*u*u*sy+3*u*u*t*p1y+3*u*t*t*p2y+t*t*t*y3;
        const c=Math.cos(t*Math.PI*2*spin),fx=Math.sign(c||1)*Math.max(.18,Math.abs(c)),s=t<.35?.5+t/.35*.75:1.25-(t-.35)/.65*.55;
        frames.push({transform:`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(2)}) scaleX(${fx.toFixed(2)})`,opacity:t<.07?t/.07:1});}
      const c=document.createElement('i');c.className='coinFly';document.body.appendChild(c);
      const an=c.animate(frames,{duration:850+Math.random()*250,delay:k*gap,easing:'cubic-bezier(.3,.05,.7,1)',fill:'backwards'});
      MR.coins.add(an);
      an.onfinish=()=>{c.remove();MR.coins.delete(an);if(gen!==MR.gen)return;
        MR.pend-=v;coinSpark(x3,y3);
        if(MR.lift)[MR.lift.querySelector('.ic'),MR.lift.querySelector('b')].forEach(e=>e.animate([{transform:'scale(1.3)'},{transform:'none'}],{duration:220,easing:'ease-out'}));
        if(k===n-1)sfx.coin();else if(k%3===0)sfx.tick(k);};
    }
  },delay);
}
function coinSpark(x,y){const s=document.createElement('i');s.className='coinSpark';s.style.cssText=`left:${x}px;top:${y}px`;
  document.body.appendChild(s);s.onanimationend=()=>s.remove();}
// Doppelte Karten und Geld-Karte einer Box-Stufe L: ihr Geld fliegt los, sobald die Karte zu sehen ist (root: Stelle mit den .cards dieser Stufe)
function dupRain(L,root,c0,step){
  const rain=(amt,j)=>coinRain(amt,()=>{const k=root.querySelector(':scope > .cards')?.children[j];return k&&k.querySelector('.cinfo .ic');},(c0+j*step+.5)*1000,true);
  L.res.forEach((c,j)=>{if(c.dup)rain(c.dup,j);});
  if(L.money)rain(L.money,L.res.length);
}

// ===================== Startplatz (Blender-Bilder aus tools/blender/launchpad.py) =====================
// Maße aus assets/pad/launchpad.json, hier eingetragen, damit das Spiel auch ohne Server läuft.
const PAD={"tower":{"ppm":10,"w":388,"level":60.0,"tile":120,"bottom":132,"deck":120.2,"top":497,"face":186.0,"axis":126.0,"half":6.0,"lift":{"x":25,"dy":2.8,"w":32,"h":37}},"arm":{"ppm":10,"h":111,"tile":40,"root":{"w":24,"at":14.0},"tip":{"w":32,"at":25.0},"crew":{"w":38,"at":31.0},"base":66.4},"moods":["day","dusk"],"bg":{"w":2560,"h":1440,"horizon":0.3,"sky_day":"#88a7c6","sky_dusk":"#3a5164"},"site":{"w":2880,"h":1369,"ppm":6,"foot":[1440.0,1187.3],"lamps":[[690.0,1148.7],[2208.0,1153.7],[1080.0,1052.6],[1860.0,1055.1]],"trench":[1440.0,1337.0],"ground":1357.8},"steam":["steam_1.png","steam_2.png","steam_3.png"]};
const PAD_DIR='assets/pad/';
// Starship-Startturm „Mechazilla“ mit Fangarmen (8b1.12) aus tools/blender/mechazilla.py (assets/pad/mz_*, Maße von Hand aus
// mechazilla.json): Meter wie am Startplatz (10 px je m), ax = Bildspalte der Raketenachse, dk = Bildzeile des Decks (Turm) bzw. der
// Fangebene (Schlitten, Arme), hx = Gelenk der Arme; face: rechte Turmseite (m links der Achse), top: Gitter-Oberkante (m),
// catch: Fangebene beim Warten (m über dem Deck); pin: Bildzeile der Fanghaken unter den Gitterflossen im Booster-Bild (ART.starship),
// gap: so viel Luft (m) bleibt unter dem gefangenen Booster, nachdem Arme und Schlitten nachgefedert haben
const MZ={ppm:10,catch:64.2,face:12,top:130,pin:510,gap:3,tower:{w:152,h:1509,ax:256,dk:1479.2},car:{w:156,h:99,ax:255,dk:22.7},
  arm:{n:16,step:5,open:75,armf:{w:187,h:73,hx:14,ax:124,dk:2.2},armb:{w:188,h:83,hx:15,ax:125,dk:27.2}}};
// Baut den Startplatz passend zur Rakete in #ground. rh/rw: Höhe/Breite der Rakete in px,
// coreW: Rumpfbreite in px. Gibt Fußhöhe der Rakete über dem Fensterrand und Steuerung zurück.
// mood: 'day' oder 'dusk' (ohne Angabe zufällig)
function setupPad(r,rh,rw,coreW,mood=Math.random()<.4?'dusk':'day'){
  const L=$('#launch'),g=$('#ground');g.innerHTML='';$('#steam').innerHTML='';
  if(!PAD.site){L.classList.remove('dusk');return {foot:GROUND,ppm:rh/100,arms:[],glow:null,trench:{x:0,y:GROUND},liftDown(){},armsAway(){}};}
  L.classList.toggle('dusk',mood==='dusk');
  $('#bgFar').style.backgroundImage=`url(${PAD_DIR}bg_${mood}.webp)`;
  L.style.setProperty('--skytop',PAD.bg['sky_'+mood]);
  const a=ART[r.id],realH=a?a.h/10:100*(r.h||1),ppm=rh/realH;   // Pixel pro Meter
  const S=PAD.site,ks=ppm/S.ppm,foot=(S.h-S.foot[1])*ks;
  const el=(tag,cls,css,parent=g)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.style.cssText=css;parent.appendChild(e);return e;};
  const img=(src,css,parent=g)=>{const e=el('img','pd',css,parent);e.src=PAD_DIR+src;e.alt='';return e;};
  const X=x=>`calc(50% + ${x}px)`;                                  // x relativ zur Raketenachse
  // Scheinwerfer-Kegel (abends) liegen hinter allem anderen
  if(mood==='dusk')S.lamps.forEach(([lx,ly])=>{
    const x=(lx-S.foot[0])*ks,y=(S.h-ly)*ks,tx=x*.15,ty=foot+rh*.45,dx=tx-x,dy=ty-y,len=Math.hypot(dx,dy);
    el('div','beam',`left:${X(x-len*.18)};bottom:${y}px;width:${len*.36}px;height:${len}px;transform:rotate(${Math.atan2(dx,dy)}rad)`);
  });
  const site=img(`site_${mood}.webp`,`width:${S.w*ks}px;left:${X(-S.foot[0]*ks)};bottom:0`);site.id='site';
  // Glühen im Flammengraben
  const glow=el('div','glow',`left:${X((S.trench[0]-S.foot[0])*ks)};bottom:${(S.h-S.trench[1])*ks}px;width:${60*ppm}px;height:${30*ppm}px`);
  // Turm links neben der Rakete: unten, n Mittelstücke, oben. Starship: eigener Turm mit Fangarmen (MZ, ein Bild)
  const mz=r.id==='starship'&&MZ.tower?MZ:null,km=mz?ppm/mz.ppm:0;
  const T=PAD.tower,kt=ppm/T.ppm,face=mz?-mz.face*ppm:-(Math.max(rw,coreW)/2+5*ppm);
  const n=Math.max(0,Math.ceil((rh*.9/kt-T.deck-2*T.level)/T.tile));
  let tw;
  if(mz)img(`mz_tower_${mood}.png`,`left:${X(-mz.tower.ax*km)};bottom:${foot-(mz.tower.h-mz.tower.dk)*km}px;width:${mz.tower.w*km}px`);
  else{
    tw=el('div','tw',`left:${X(face-T.face*kt)};bottom:${foot-(T.bottom-T.deck)*kt}px;width:${T.w*kt}px`);
    img(`tower_${mood}_top.png`,`width:100%`,tw);
    el('div','',`height:${n*T.tile*kt}px;background:url(${PAD_DIR}tower_${mood}_mid.png) 0 0/100% ${T.tile*kt}px repeat-y`,tw);
    img(`tower_${mood}_bottom.png`,`width:100%`,tw);
  }
  const latticeTop=mz?mz.top*ppm:(T.deck+n*T.tile+2*T.level)*kt;     // Gitter-Oberkante über dem Deck
  // Versorgungsarme: an den Stufen-Oberkanten (Bild-Raketen) oder an festen Anteilen der Höhe
  const A=PAD.arm,ka=ppm/A.ppm,cos=Math.cos(8*Math.PI/180);
  let zs;
  if(a){zs=a.order.filter(k=>!['eng','tower','top','side'].includes(k)&&r.parts.some(p=>p.k===k)).map(k=>(a.h-a.parts[k].y0)/10-4);
    if(a.parts.top)zs.push({z:(a.h-a.parts.top.y0)/10-4.5,crew:!!r.crew});}
  else zs=[.18,.48,.74].map(f=>f*realH).concat(r.crew?[{z:.86*realH,crew:true}]:[]);
  // Starship: am Booster greifen die Fangarme an, nur der Arm zum Raumschiff bleibt
  const arms=zs.map(v=>typeof v==='number'?{z:v,crew:false}:v).filter(v=>v.z*ppm<latticeTop-4*ppm&&v.z>3&&(!mz||v.crew)).map(({z,crew})=>{
    const len=-coreW/2+.4*ppm-face,end=crew?A.crew:A.tip;
    const arm=el('div',mz?'arm mzq':'arm',`left:${X(face)};bottom:${foot+z*ppm*cos-(A.h-A.base)*ka}px;width:${len}px;height:${A.h*ka}px`);
    el('div','',`left:0;width:${len}px;height:100%;background:url(${PAD_DIR}arm_${mood}_truss.png) 0 0/${A.tile*ka}px 100% repeat-x`,arm);
    img(`arm_${mood}_root.png`,`left:${-A.root.at*ka}px;width:${A.root.w*ka}px;height:100%`,arm);
    img(`arm_${mood}_${crew?'crew':'tip'}.png`,`left:${len-end.at*ka}px;width:${end.w*ka}px;height:100%`,arm);
    return {el:arm,crew,z};
  });
  // Aufzug: steht oben beim Crew-Arm und fährt im Countdown herunter (Starship: Aufzug innen im Turm, keiner zu sehen)
  const Lf=T.lift,crewZ=(arms.find(x=>x.crew)||{z:0}).z;
  const liftAt=z=>(T.bottom-T.deck-Lf.dy)*kt+z*ppm*cos+'px';
  const lift=mz?null:img(`lift_${mood}.png`,`left:${Lf.x*kt}px;width:${Lf.w*kt}px;bottom:${liftAt(Math.max(0,crewZ-1))}`,tw);
  if(lift)lift.classList.add('lift');
  // Starship (8b1.12): Schlitten am Turm mit zwei Fangarmen. Hinterer Arm und Schlitten in #ground (hinter der Rakete), vorderer Arm

  // ===== Stufentrennung als Ablauf: Nahaufnahme, Brennschluss, Abwurf mit Ruck und Wölkchen, Lücke, Zündung, Kamera zurück =====

  function sideOff(ta){

  // Brennschluss der unteren Stufe

  // Zwischenstufen-Ring der Saturn V (S-II): fällt kurz nach der Zündung ab, die Flammen brennen durch ihn hindurch (er ist offen)

  // heißes Trennen (Sojus): die obere Stufe zündet im offenen Gitter, das Feuer schlägt seitlich heraus; Abwurf danach

  // ===== Starship: heiße Trennung wie im Live-Stream =====
  // Super Heavy drosselt bis auf die inneren Raptor, die sechs Raptor des Raumschiffs zünden noch angedockt: ihr Feuer schlägt durch

  function shipOff(){

  const tapSp=res.tap?SEPS.find(s=>!s.side&&!s.ship):null,TAP_A=2.2,TAP_B=1.1,TAP_OK=.4,TAP_TOP=.13;let tp=null;

    } else if(phase==='land'&&pad.mz)catchFrame(now); // Starship: der Turm fängt den Booster
    else if(phase==='land'){
      const p=Math.min(1,(now-phaseT)/3800);
      y=startY*Math.pow(1-p,2);place();
      setAlt(altText(Math.max(y/pad.ppm/1000,50*Math.pow(y/startY,4))),'Startplatz',1-p); // kurz über dem Boden echte Meter; Balken schrumpft mit der Höhe
      if(p>=1){phase='done';flame.style.display='none';smoke(false);lSay('Gelandet!',{ic:'check',l:'Landung',k:'land'});
        later(ssBack?()=>blackout(shipHome):finish,ssBack?1700:2400); // Starship: danach kommt das Raumschiff zurück (shipHome)
        sfx.land();}
    } else if(phase==='home')homeFrame(now,dt);
    else if(phase==='goal')goalFrame(dt);
    if(em&&phase!=='up')emTick(dt); // späte Notfälle (im All, Satellit, Rückkehr)
    stepPieces(Math.min(rdt,.1)*spdNow());
    if(bt>=0)boomStep(dt); // Explosion: Bildfolgen, Funken, Trümmer
    // glühende Düse der Oberstufe: wird beim Brennen hell, kühlt nach dem Brennschluss langsam ab
    if(uHot){const b=flame.style.display==='block';hotK+=((b?1:0)-hotK)*Math.min(1,dt*(b?1.1:.3));uHot.style.opacity=hotK.toFixed(3);}
    if(zm){ // Nahaufnahme: Vergrößerung weich zum Ziel, Bildausschnitt folgt jedes Bild der fliegenden Rakete
      if(zm.z!==zm.b){const u=Math.min(1,(now-zm.t0)/zm.dur);zm.z=u>=1?zm.b:zm.a+(zm.b-zm.a)*u*u*(3-2*u);}
      setZoom(zm.z);if(zm.z===1&&zm.b===1)zoomClear();}
    if(flame.style.display==='block'){flicker(sk);exhaust(dt,phase==='up');}
    drawPlume(dt);
    shakeStep(now,rmbG,dt);
    if(!ended)raf=requestAnimationFrame(frame);
  }
  // Alarm-Knopf beim Schnellstart gedrückt: kein Countdown, die Rakete ist schon unterwegs, gleich kommt der Notfall
  // (hl0.16) Rückkehr-Notfälle: gleich in die Rückkehr der Kapsel; sonst kurz vor dem Notfall in den Aufstieg (bzw. kurz vor dem Brennschluss)
  if(jump&&ET.ph==='home'){phase='done';holder.style.visibility='hidden';ff.style.display='none';y=Y_END;place(1);cloudsClear();homePre();later(home,500);}
  else if(jump){phase='up';const T=Math.max(0,ET.ph==='up'?emT-1.4:ET.ph==='sep'?sepAt-1.6:ASC_T-1.2);
    skipTo(T);flame.style.display='block';if(T<4)smoke(false);sfx.engineStart();}
  raf=requestAnimationFrame(frame);
}

// ===================== Sieg & Hilfe =====================
function checkWin(){
  if(!ROCKETS.every(unlocked))return false;
  // Pokal sofort speichern (nur einmal pro Spiel, auch wenn checkWin nochmal kommt)
  const n=(S.wins||0)+1;S.trophies=S.trophies||[];
  let t=S.trophies.find(x=>x.n===n);
  if(!t){t={n,d:Date.now(),s:S.launches||0};S.trophies.push(t);save();render();}
  $('#modalBody').classList.add('narrow');
  $('#modalBody').innerHTML=`<div class="center res"><div class="resic gold">${ic('trophy')}</div><span class="kick">Alle Raketen gesammelt</span>
   <h2>Du hast ALLE ${ROCKETS.length} Raketen gesammelt!</h2>
   <p>Wahnsinn! Du bist ein echter Raketen-Profi. Dafür bekommst du einen <b>Pokal</b>. Den behältst du – auch im neuen Spiel!</p>
   <div class="tros">${troCard(t,'new')}</div>
   <p>Jetzt geht das Spiel wieder von vorne los – schaffst du es nochmal?</p>
   <div class="dfoot"><button class="btn primary okbtn" onclick="newRound()">${ic('rocket')}Neues Spiel starten</button></div></div>`;
  $('#modal').classList.remove('hidden');
  return true;
}
function newRound(){S=fresh((S.wins||0)+1,S.trophies||[]);coinStop();save();closeModal();giveStarter();}
// Alle Pokale der Reihe nach; Siege aus der Zeit vor den Pokalen (nur S.wins) zählen als Pokal ohne Datum
function trophyList(){const T=S.trophies||[],n=Math.max(S.wins||0,...T.map(t=>t.n));
  return Array.from({length:n},(_,i)=>T.find(t=>t.n===i+1)||{n:i+1});}
function troCard(t,cls=''){
  return `<div class="tro ${cls}">${ic('trophy')}<b class="tn">${t.n}.</b><span class="td">${t.d?new Date(t.d).toLocaleDateString('de-DE'):'Pokal'}</span>
    <span class="ts">${t.d?(t.s===1?'1 Start':`${fmt(t.s||0)} Starts`):'früher gewonnen'}</span></div>`;}
function showTrophies(){
  const L=trophyList();
  $('#modalBody').classList.add('narrow');
  $('#modalBody').innerHTML=`<div class="center res"><div class="resic gold">${ic('trophy')}</div><span class="kick">Dein Pokal-Regal</span>
   <h2>${L.length===1?'1 Pokal':`${L.length} Pokale`}</h2>
   <div class="tros">${L.map(t=>troCard(t)).join('')}</div>
   <p class="note">Einen Pokal bekommst du, wenn du alle ${ROCKETS.length} Raketen gesammelt hast. Die Pokale bleiben für immer.</p>
   <div class="dfoot"><button class="btn primary okbtn" onclick="closeModal()">${ic('check')}Fertig</button></div></div>`;
  $('#modal').classList.remove('hidden');
}
const restCost=r=>{const s=builtSet(r);return r.parts.filter(p=>!s.has(p.k)).reduce((a,p)=>a+p.cost,0);};
// Sicherheitsnetz: Man darf nie ohne Möglichkeit weiterzuspielen dastehen
function checkBroke(){
  if(ROCKETS.some(r=>unlocked(r)&&complete(r)))return; // man kann starten (oder wartet kurz)
  const open=ROCKETS.filter(unlocked);
  if(open.length){
    const need=Math.min(...open.map(restCost));
    if(S.money>=need)return;
    if(need<=1500){ // fehlendes Geld für die günstigste Rakete schenken
      const gift=need-S.money;S.money=need;save();render();sfx.coin();
      toast(`Die Raumfahrtbehörde schenkt dir ${coins(gift)}, damit du deine Rakete fertig bauen kannst!`,'gift');
      return;
    }
  }
  if(S.money<BOXES[0].price){S.money+=200;save();render();sfx.coin();toast(`Die Raumfahrtbehörde hilft dir mit ${coins(200)} aus!`,'gift');}
}
// Startgeschenk: eine zufällige gewöhnliche Rakete, fertig gebaut
function giveStarter(){
  const pool=ROCKETS.filter(r=>r.tier===0),fresh=pool.filter(r=>!unlocked(r));
  const list=fresh.length?fresh:pool,r=list[Math.floor(Math.random()*list.length)];
  S.cards[r.id]=Math.max(cardsOf(r),CARDS_NEEDED);
  S.built[r.id]=r.parts.map(p=>p.k);
  S.gift=r.id;save();render();
  $('#modalBody').classList.add('narrow');
  $('#modalBody').innerHTML=`<div class="center res"><div class="resic">${ic('gift')}</div><span class="kick">Willkommen</span><h2>Willkommen, Raketen-Chef!</h2>
    <p>Als Geschenk bekommst du eine Rakete – fertig gebaut und startbereit!</p>
    <div class="cards">${cardBase(r,`<span class="okc">${ic('check')}Startbereit</span>`,.2)}</div>
    <p class="note">Starte sie, um Geld zu verdienen. Mit dem Geld kaufst du Glücksboxen für neue Raketen.</p>
    <div class="dfoot"><button class="btn primary okbtn" onclick="closeModal();setTab('hangar');openBuild(byId('${r.id}'))">${ic('rocket')}Zur Rakete</button></div></div>`;
  $('#modal').classList.remove('hidden');pixelizeAll($('#modalBody'));
}
function resetGame(){if(confirm(`Wirklich alles löschen${trophyList().length?' – auch deine Pokale –':''} und ganz von vorne anfangen?`)){S=fresh();coinStop();save();render();giveStarter();}}

// Vorbereitungszeit herunterzählen
setInterval(()=>{
  if(!Object.values(S.cool).some(v=>v>Date.now()-1500))return;
  // nur Geändertes neu zeichnen, damit laufende Animationen (Start-Knopf, LED, Holo-Glanz) nicht jede Sekunde neu anfangen
  if(cur&&inScene()&&Math.ceil(coolLeft(cur)/1000)!==BS.ck)renderBuild();
  if(tab==='hangar')ROCKETS.forEach(r=>{if((S.cool[r.id]||0)<=Date.now()-1500)return;
    const t=$(`#hangarView .tile[data-id="${r.id}"] .tst`),h=tileStatus(r);if(t&&t.innerHTML!==h)t.innerHTML=h;});
},1000);

render();
addEventListener('load',()=>setTimeout(preloadPad,500));
addEventListener('load',()=>setTimeout(bfxLoad,2500)); // Explosions-Bilder: erst wenn der Startplatz geladen wird, nicht vorher
// Beim Laden: Geschenk für neue (und alte) Spielstände, sonst prüfen, ob man festhängt
if(!S.gift)giveStarter();else checkBroke();
</script>
